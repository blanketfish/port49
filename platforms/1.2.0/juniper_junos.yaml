# juniper_junos — vSRX 21.4R3.15 and vJunos-router 23.4R2-S2.1 in the port49 lab.
# Every value is measured and cited, or marked unmeasured and chosen in the
# direction that fails closed (spec §8, §15).
platforms:
  juniper_junos:
    # Every reply this adapter renders was applied by both lab images as the
    # adapter says, no wider than port49 permits, and every wire regex it
    # renders was taken by the commit checker
    # (tests/lab/results/L12-projection-juniper_*.md; spec §15, L9, L10, L12).
    verified: containerlab
    # Session authorization only: no per-command request in 26 sessions on two
    # images (L18; decision 21). Its rules reach a session through the
    # projection below (decision 22).
    supports: [session]
    # The composed rules render into the session reply as the Junos login
    # class model reads it: permission bits, then deny-commands and
    # allow-commands, a matching allow beating any deny (L11, closed;
    # tests/lab/results/L12-juniper_*.md). What the regexes rest on — explicit
    # anchors, case, abbreviations — is L9's (tests/lab/results/L9-juniper_*.md)
    # and internal/projection's JunosFacts.
    command_projection: junos_regex
    # The bits go on the wire as user-permissions, over `remote`'s bitless
    # p49-remote: on both images a user-permissions value over a bitless
    # template was applied, both bits of a two-bit value were, and one
    # session's value left another's permissions unchanged
    # (tests/lab/results/L12-juniper_*.md; branch C). No template is named, so
    # the generator sends the smallest bits a grant needs, and a bit a deny
    # would only carve is dropped instead of sent.
    bit_delivery: user_permissions
    # Set 1.2.0: what the reply denies beside a deny beneath its bits, to close
    # the RPC entry points per user (decision 44). `op **` is on the list
    # because `op` still reached past the `junoscript` deny on both images
    # (tests/lab/results/L26c-scripts-juniper_*.md, op row). A block may drop
    # one, never add one.
    rpc_entry_denies: ["junoscript **", "op **"]
    # The keyword tree (platforms/keywords/1.2.0/juniper_junos.yaml) is proven
    # on vJunos-router 23.4R2-S2.1 and vSRX 21.4R3.15 only
    # (tests/lab/results/L26-juniper_*.md, L26b-juniper_*.md); on another
    # release or hardware family a word it proves a keyword may take an
    # argument (spec §8).
    #
    # A wire deny binds the CLI and a `<command>` RPC, never a native RPC
    # (tests/lab/results/L12-netconf-juniper_*.md, L26c-juniper_*.md), and a CLI
    # session reaches native RPCs through `xml-mode`. A deny of `junoscript`
    # closes that entry for the session whose reply carries it, and its NETCONF
    # on port 830, the control reaching both (L26c-junoscript-juniper_*.md; the
    # rest of L26c: L26c-entries-juniper_*.md, L26c-scripts-juniper_*.md). So
    # where a deny is the only guard beneath a sent bit or the baseline, the
    # reply adds rpc_entry_denies and keeps the capability shape; that subject
    # has no NETCONF. `port49 devices check-config` fails J-Web
    # (`web-management`) and JET/gRPC/gNMI (`extension-service`), which no
    # measurement shows the deny closes.
    #
    # Each bit's reach in rule form: every command a class holding that bit
    # alone ran or completed in the lab, the union of both images, as rules
    # that hold them, an upper bound (tests/lab/results/L12-bits-juniper_*.md).
    # A top-level word the baseline reaches is held whole (`request **`):
    # completion does not list Junos's hidden commands, so a reach word by word
    # could under-report. `xml-mode` is hidden, so no completion lists it, yet
    # a class holding `view` alone ran it (tests/lab/results/L26c-juniper_*.md):
    # the baseline holds it, an upper bound. A session runs the union of its
    # bits' reach.
    # `baseline` is what a class with no bits runs, held by every session: the
    # projection denies each of its commands no permit holds. `all` is every
    # bit.
    bits:
      baseline: ["help **", "quit **", "exit **", "set cli **", "show cli **", "file **", "load **", "op **", "request **",
        "save **", "scp **", "set **", "start **", "test **", "xml-mode **"]
      clear: ["clear **", "request mpls **", "set chassis **"]
      network: ["ping **", "traceroute **", "ssh **", "telnet **", "mtrace **", "probe **", "request routing-engine **"]
      trace: ["monitor **"]
      view: ["show **", "request flight-recorder **", "request pppoe **", "request snmp **", "request validation **",
        "test interface **", "test msdp **", "test policy **", "test rib-sharding **", "test services **"]
      view-configuration: ["show configuration **", "show log **", "show firewall **", "show policer **", "monitor **",
        "request mpls **", "request path-computation-client **", "request security **", "request unified-edge **",
        "request virtual-chassis **", "load dhcp-security-snoop **", "save dhcp-security-snoop **"]
      all: ["**"]
    # The only subtractions from the union: commands a bit alone makes
    # available, whatever other bit reaches them. Under `view` without
    # `view-configuration` the configuration is not shown: measured on three
    # hierarchies, both images (tests/lab/results/L12-bits-juniper_*.md,
    # "carve-outs"; the bare command is not probed). `show log`, `show
    # firewall` and `show policer` complete for the `view view-configuration`
    # pair and for neither bit alone, on both images: completion evidence, no
    # probe ran them (the same notes, "Reading"), so view-configuration's
    # reach above holds them too: an upper bound, since neither bit alone
    # offers them. Only a listed carve-out lets the projection leave a deny
    # off the wire, and on Junos, where a deny binds no RPC, only `show
    # configuration **`, the one measured holding over RPC too (L26c).
    carve_outs:
      view-configuration: ["show configuration **", "show log **", "show firewall **", "show policer **"]
    # Each level's ceiling in bits. readonly is show and info, operator adds
    # the non-disruptive state changes and no configuration, admin is
    # everything (the owner's level definitions, 2026-09-24). Spec §8's
    # example operator also holds `reset`, which restarts software processes:
    # disruptive, so not here.
    privilege:
      readonly: [view, view-configuration]
      operator: [clear, network, trace, view, view-configuration]
      admin: [all]
    # No priv-lvl is sent: the bits are the fence. The token's ceiling still
    # needs a number; every Junos request carries priv_lvl 1
    # (tests/lab/results/junos-session-service-juniper_vjunos-router.md), so
    # readonly numbers 1, and operator numbers as admin, as decision 23 does
    # where the device's number fences nothing.
    ceiling_levels: {readonly: 1, operator: 15, admin: 15}
    # What the replies depend on, in `show configuration | display set` form.
    device_config:
      # Required: without it a port49 denial is advisory and the session opens
      # in the remote template (L17-juniper_*.md).
      - set system tacplus-options strict-authorization
    # The template user and its class are the reference `port49 platform
    # export --classes` writes, and `port49 devices check-config --config`
    # holds a device to: `remote` in the bitless p49-remote, where every
    # projected session lands, since no reply names a template, and where one
    # naming a template the device lacks would land too (L18-juniper_*.md,
    # variant 7).
    # fxp0 is the interface the lab reaches both images on
    # (tests/lab/configs/vjunos-startup.conf); em0 is spec §8's example and no
    # lab image uses it.
    entity_classes:
      management: ['^(fxp0|em0)$']
    # Junos sends no command to expand; unmeasured, so false, the direction
    # that fails closed.
    expands_abbreviations: false
    splits_interface_names: false
    # Junos never authorizes a command (L18; decision 21), so no modifier
    # reaches port49.
    pipe_token: "|"
    pipe_authorized: false
    # Unmeasured for a command request, which Junos never sends; its
    # accounting records end `<cr>` (tests/lab/results/L17-juniper_vjunos-router.md), and
    # true is every measured platform's value.
    strip_cr: true
    # No command request to carry one; unmeasured, so false.
    shows_server_msg: false
    # Every name the projection sends, and the configuration regexes it never
    # sends: all carry privilege (spec §8).
    privilege_attributes: [local-user-name, user-permissions, allow-commands, deny-commands, allow-configuration,
      deny-configuration, allow-commands-regexps, deny-commands-regexps, allow-configuration-regexps,
      deny-configuration-regexps]
    inert_attributes: [home-directory]
    # `port49 devices check-config` (spec §5.6), set or hierarchical form: a
    # name quoted or bare, and an account `show configuration` prints under a
    # protect: or inactive: prefix, which is still an account (an inactive one
    # is read too, failing closed: one `activate` brings it back).
    local_accounts: ['^set\s+system\s+login\s+user\s+"?([^\s"]+)', '^\s*(?:(?:protect|inactive):\s+)*user\s+"?([^\s"{]+)"?\s*\{']
    config_checks:
      - match: 'authentication-order .*\bpassword\b'
        says: "a FAIL from port49 falls through to the local password on this platform (tests/lab/results/L4-juniper_vsrx.md, L4-juniper_vjunos-router.md): a denied operator logs in locally"
      - match: '^set\s+system\s+login\s+class\s+p49-remote\s+permissions\b'
        says: "the remote template's class carries bits: every projected session lands in remote, where user-permissions merges with them or is ignored (tests/lab/results/L12-juniper_*.md), and runs them, which port49 never granted; read this check against `show configuration | display set`"
