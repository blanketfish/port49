# The Kubernetes shape's smoke (plan 12b, Task 11): the chart on a kind cluster with port49's own etcd.
# make kind-smoke runs the cells; make kind-smoke-red runs the fsGroup cell against the first design's
# 2755 volume root, with issuance on, and passes only when the kubelet's walk leaves the broker's
# issuing-ca.key unusable (its log says so and it issues nothing), so a green job is the red result observed.
#
# Kind's nodes are privileged containers, so the key-host guard refuses on a machine that holds a TPM or
# a security key (tests/shapes/shapetest/keyhost.go). A hosted runner is ephemeral and holds nobody's key,
# so only each job's env overrides it.
name: kind
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  smoke:
    name: kind-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORT49_SMOKE_ON_KEY_HOST: "1"
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make kind-smoke
  smoke-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORT49_SMOKE_ON_KEY_HOST: "1"
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make kind-smoke-red
  enrollments:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORT49_SMOKE_ON_KEY_HOST: "1"
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make kind-enrollments
