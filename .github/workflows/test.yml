# make test and make vet on GitHub-hosted runners (plan 12b, Task 4). The suite is split so
# no job nears its limit: internal/port49d is cut in three by tests/ci/cmd/testshard, and the
# `shards` job fails if the cut drops or repeats a test. Tests that skip without root or an ACL
# are run where they cannot skip, and tests/ci/cmd/mustpass fails the job if one does. The race
# detector runs the same cut, so the `shards` check covers both.
name: test
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make vet
      - run: make check-static
  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y acl busybox
      - run: make test-rest
  port49d:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make test-shard SHARD=${{ matrix.shard }}
  race-rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make race-rest
  race-port49d:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make race-shard SHARD=${{ matrix.shard }}
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go run ./tests/ci/cmd/testshard -pkg ./internal/port49d -check -n 3
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: sudo apt-get install -y acl
      - run: sudo -E env "PATH=$PATH" make test-root
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go run ./tests/ci/cmd/versioncheck
