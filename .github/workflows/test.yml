# make test and make vet on GitHub-hosted runners (plan 12b, Task 4). The suite is split so
# no job nears its limit: internal/port49d is cut in three by tests/ci/cmd/testshard, and the
# `shards` job fails if the cut drops or repeats a test. Tests that skip without root or an ACL
# are run where they cannot skip, and tests/ci/cmd/mustpass fails the job if one does. The race
# detector runs the same cut, so the `shards` check covers both.
name: test
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make vet
      - run: make check-static
  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y acl busybox
      - run: make test-rest
  port49d:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make test-shard SHARD=${{ matrix.shard }}
  race-rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make race-rest
  race-port49d:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make race-shard SHARD=${{ matrix.shard }}
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go run ./tests/ci/cmd/testshard -pkg ./internal/port49d -check -n 3
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: sudo apt-get install -y acl
      - run: sudo -E env "PATH=$PATH" make test-root
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go run ./tests/ci/cmd/versioncheck
  # The release workflow installs packaging/requirements-release.txt with Python 3.12; the file is compiled
  # on another Python (see the Makefile). A dependency the two resolve differently fails here, on every
  # pull request, instead of at tag time.
  release-requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --dry-run --require-hashes -r packaging/requirements-release.txt
  # The packages are built by the pinned GoReleaser (snapshot, nothing published or signed) and checked on
  # every pull request, under the runner's default umask: file and directory modes come from
  # .goreleaser.yaml, never from the builder. The tests read dist/ and need rpm and dpkg-deb (a hosted
  # Ubuntu runner has dpkg-deb). The client package's import test runs in a digest-pinned Debian container and installs ansible-core from the hashed requirements; its first run is here.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: sudo apt-get install -y rpm
      - run: make packages
      - run: go test -tags packages ./tests/packages/ -count=1 -v
  # The alert rules on real promtool 3.5.0 (the pinned, sha256-checked binary): the rules parse and each one
  # fires and stays quiet on its synthetic series. `make test` runs tests/alerts without promtool.
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: make alerts-check
  # The chart's checks on real helm 3.22.0 (the pinned, sha256-checked binary), not only the Go stand-in
  # that `make test` runs: the helm-tagged tests fail rather than skip when the binary is missing.
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: make helm-test
