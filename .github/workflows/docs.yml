name: docs

# The site builds on every pull request, so `docs` can be a required check. It deploys, with mike,
# for a push to main (as "dev") or a final release tag that is the highest patch of its X.Y line
# (as "X.Y"), and only once the repository is public: tests/ci/cmd/docspublish decides the
# version and its aliases, the `if:` line the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - id: publish
        run: go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # the same flags as deploy's install: this check proves, on every pull request, that the deploy's
      # wheels-only hashed install works on this Python
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: go test ./internal/docgen/ ./tests/ci/ -count=1
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ steps.publish.outputs.banner }}
      - run: PORT49_DOCS_SITE=site go test ./tests/ci/ -run '^TestTheBuiltSite' -count=1

  # One copy of the site per version lives on the gh-pages branch (mike), and Pages serves that
  # branch through GitHub's own pages-build job, so this job needs no Pages permission, no OIDC
  # token and no environment. It is the one job that writes the repository: `contents: write` exists
  # only for the single `git push ... gh-pages:gh-pages` below. The checkout keeps no credentials, and
  # the token is removed (`env -u GH_TOKEN`) from every process that builds, so the docs toolchain
  # never sees it.
  #
  # Two deploys can overlap, a tag's and the main push after it, so nothing decided earlier is trusted:
  # the version and aliases come from docspublish run here, after the tags are fetched, not from the
  # build job (whose answer can be stale by now), and the whole attempt (fetch gh-pages, decide, build,
  # push) is repeated up to 3 times when the push loses the race for the branch. The group is per ref:
  # one group for all refs would let a newer pending main deploy cancel a pending tag deploy.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          GH_TOKEN: ${{ github.token }}
          NO_MKDOCS_2_WARNING: '1'
        run: |
          set -eu
          wt="$RUNNER_TEMP/gh-pages"
          for attempt in 1 2 3; do
            git worktree remove --force "$wt" 2>/dev/null || true
            git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            git branch -D gh-pages 2>/dev/null || true
            git fetch --force origin '+refs/heads/gh-pages:refs/heads/gh-pages' || echo "no gh-pages branch yet"
            out=$(env -u GH_TOKEN go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF")
            publish=$(printf '%s\n' "$out" | sed -n 's/^publish=//p')
            if [ "$publish" != true ]; then
              echo "docspublish: nothing to publish for $GITHUB_REF any more"
              exit 0
            fi
            banner=$(printf '%s\n' "$out" | sed -n 's/^banner=//p')
            version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')
            aliases=$(printf '%s\n' "$out" | sed -n 's/^aliases=//p')
            echo "deploying $version with aliases: $aliases"
            env -u GH_TOKEN PORT49_DOCS_BANNER="$banner" mike deploy --update-aliases --branch gh-pages --remote origin "$version" $aliases
            # the site root redirects to latest, so a link to /port49/latest/... is the stable deep link
            env -u GH_TOKEN mike set-default --branch gh-pages --remote origin latest
            # the root 404 sends pre-versioning links to latest; the root llms.txt is latest's
            git worktree add "$wt" gh-pages
            cp .github/docs-404.html "$wt/404.html"
            cp "$wt/latest/llms.txt" "$wt/llms.txt"
            git -C "$wt" add 404.html llms.txt
            git -C "$wt" diff --cached --quiet || git -C "$wt" commit -q -m "docs: root 404 and llms.txt"
            git worktree remove --force "$wt"
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages; then
              exit 0
            fi
            echo "the push of gh-pages failed (attempt $attempt of 3)"
            sleep $((attempt * 5))
          done
          echo "gh-pages was not published after 3 attempts" >&2
          exit 1
