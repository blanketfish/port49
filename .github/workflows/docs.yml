name: docs

# The site builds on every pull request, so `docs` can be a required check. It deploys, with mike,
# for a push to main (as "dev") or a final release tag that is the highest patch of its X.Y line
# (as "X.Y"), and only once the repository is public: tests/ci/cmd/docspublish decides the
# version and its aliases, the `if:` line the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      banner: ${{ steps.publish.outputs.banner }}
      version: ${{ steps.publish.outputs.version }}
      aliases: ${{ steps.publish.outputs.aliases }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - id: publish
        run: go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r packaging/requirements-docs.txt
      - run: go test ./internal/docgen/ ./tests/ci/ -count=1
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ steps.publish.outputs.banner }}
      - run: PORT49_DOCS_SITE=site go test ./tests/ci/ -run '^TestTheBuiltSite' -count=1

  # One copy of the site per version lives on the gh-pages branch (mike), and Pages serves that
  # branch through GitHub's own pages-build job, so this job needs no Pages permission, no OIDC
  # token and no environment. It is the one job that writes the repository: `contents: write` and a
  # checkout that keeps its credentials exist only so mike can push gh-pages, and `--branch gh-pages`
  # on both commands is the only ref it touches. The group serializes deploys: two mike pushes racing
  # on one branch would lose one of them.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r packaging/requirements-docs.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: mike deploy --push --update-aliases --branch gh-pages --remote origin "$VERSION" $ALIASES
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ needs.build.outputs.banner }}
          VERSION: ${{ needs.build.outputs.version }}
          ALIASES: ${{ needs.build.outputs.aliases }}
      # the site root redirects to latest, so a link to /port49/latest/... is the stable deep link
      - run: mike set-default --push --branch gh-pages --remote origin latest
