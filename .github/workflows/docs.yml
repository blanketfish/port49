name: docs

# The site builds on every pull request, so `docs` can be a required check. It deploys only for
# a push to main (until the first release tag) or a final release tag, and only once the
# repository is public: tests/ci/cmd/docspublish decides the first, the `if:` lines the second.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - id: publish
        run: go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r packaging/requirements-docs.txt
      - run: go test ./internal/docgen/ ./tests/ci/ -count=1
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ steps.publish.outputs.banner }}
      - run: PORT49_DOCS_SITE=site go test ./tests/ci/ -run '^TestTheBuiltSite' -count=1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.publish.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
