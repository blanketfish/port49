name: docs

# The site builds on every pull request, so `docs` can be a required check. It deploys, with mike,
# for a push to main (as "dev") or a final release tag that is the highest patch of its X.Y line
# (as "X.Y"), and only once the repository is public: tests/ci/cmd/docspublish decides the
# version and its aliases, the `if:` lines the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - id: publish
        run: go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # the same flags as deploy's install: this check proves, on every pull request, that the deploy's
      # wheels-only hashed install works on this Python
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: go test ./internal/docgen/ ./tests/ci/ -count=1
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ steps.publish.outputs.banner }}
      - run: PORT49_DOCS_SITE=site go test ./tests/ci/ -run '^TestTheBuiltSite' -count=1

  # One copy of the site per version lives on the gh-pages branch (mike), and Pages serves that branch
  # through GitHub's own pages-build job, so nothing here needs a Pages permission, an OIDC token or an
  # environment. The deploy is two jobs, because steps of one job share a machine and only a job
  # boundary keeps a token from the code that builds the site:
  #   - `deploy` runs the docs toolchain (pip-installed code, mkdocs, mike) in a job with no write token:
  #     `contents: read`, and no token anywhere in it. It builds, commits gh-pages in its own checkout
  #     and uploads that branch as a git bundle.
  #   - `push-pages` has the write token, and runs only git on a verified bundle: no checkout, no
  #     setup action, no repository code.
  #
  # Two deploys can overlap, a tag's and the main push after it, so nothing decided earlier is trusted:
  # `deploy` takes the version and aliases from docspublish run in that job, not from the build job
  # (whose answer can be stale by now), after fetching gh-pages and then the tags, so every tag whose
  # deploy is already on the gh-pages it saw is in the tag list it decides from.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          set -eu
          # gh-pages first, then the tags: a tag whose deploy is already in the gh-pages fetched here
          # was pushed before this fetch of tags, so it is in the list docspublish decides from
          git fetch --force origin '+refs/heads/gh-pages:refs/heads/gh-pages' || echo "no gh-pages branch yet"
          # the same fetch updates origin/main: a main run, or a re-run, whose commit is no longer
          # main's tip publishes nothing, so it cannot put older docs back on dev (or latest)
          git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          out=$(go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" -sha "$GITHUB_SHA")
          publish=$(printf '%s\n' "$out" | sed -n 's/^publish=//p')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" != true ]; then
            echo "docspublish: nothing to publish for $GITHUB_REF"
            exit 0
          fi
          banner=$(printf '%s\n' "$out" | sed -n 's/^banner=//p')
          version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')
          aliases=$(printf '%s\n' "$out" | sed -n 's/^aliases=//p')
          echo "deploying $version with aliases: $aliases"
          PORT49_DOCS_BANNER="$banner" mike deploy --update-aliases --branch gh-pages --remote origin "$version" $aliases
          # the site root redirects to latest, so a link to /port49/latest/... is the stable deep link
          mike set-default --branch gh-pages --remote origin latest
          # the root 404 sends pre-versioning links to latest; the root llms.txt is latest's
          wt="$RUNNER_TEMP/gh-pages"
          git worktree add "$wt" gh-pages
          cp .github/docs-404.html "$wt/404.html"
          cp "$wt/latest/llms.txt" "$wt/llms.txt"
          git -C "$wt" add 404.html llms.txt
          git -C "$wt" diff --cached --quiet || git -C "$wt" commit -q -m "docs: root 404 and llms.txt"
          git worktree remove --force "$wt"
          git bundle create "$RUNNER_TEMP/gh-pages.bundle" gh-pages
      - if: steps.site.outputs.publish == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gh-pages-bundle
          path: ${{ runner.temp }}/gh-pages.bundle
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # The only job with a write token. It runs no repository code: a pinned download, then git, which
  # verifies the bundle, fetches it into a clean bare repository (objects checked), and pushes gh-pages
  # from there with hooks, the runner's git configuration and any credential helper off. The push is
  # never forced: a stale bundle is rejected, never applied.
  #
  # The group is per ref and only here. Deploy writes nothing, so it needs none. A main run's push can
  # then neither queue behind nor cancel a tag run's pending push; a newer pending push of the same ref
  # supersedes an older one, which is right because its build is newer. A rejected main push whose
  # commit is no longer main's tip lost to a newer main run, which deploys newer docs: it ends green,
  # "superseded". Any other rejected push (a tag's, or main's tip losing to a tag) fails red; the message
  # says to re-run all jobs of the run, since re-running only this job would push the same stale bundle.
  # Re-running a main run is safe: docspublish publishes main only from main's tip.
  push-pages:
    needs: deploy
    if: needs.deploy.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gh-pages-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gh-pages-bundle
          path: ${{ runner.temp }}/bundle
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          b="$RUNNER_TEMP/bundle/gh-pages.bundle"
          t=$(mktemp -d)
          git init -q --bare "$t"
          git -C "$t" bundle verify "$b"
          git -C "$t" -c transfer.fsckObjects=true fetch -q "$b" gh-pages:gh-pages
          if ! git -C "$t" -c core.hooksPath=/dev/null -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages; then
            # main only: if main has moved on, the newer main run deploys newer docs, so losing to it is
            # no failure. Main's tip is read with no token (the repository is public, as the if: requires).
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              tip=$(git -c core.hooksPath=/dev/null -c credential.helper= ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
              tip=${tip%%[[:space:]]*}
              if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
                echo "superseded by a newer main push; nothing to do"
                exit 0
              fi
            fi
            echo "another deploy moved gh-pages; re-run all jobs of this run (not only this job: it would retry the same stale bundle)" >&2
            exit 1
          fi
