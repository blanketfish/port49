name: docs

# The site builds on every pull request, so `docs` can be a required check. It deploys, with mike,
# for a push to main (as "dev") or a final release tag that is the highest patch of its X.Y line
# (as "X.Y"), and only once the repository is public: tests/ci/cmd/docspublish decides the
# version and its aliases, the `if:` line the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - id: publish
        run: go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # the same flags as deploy's install: this check proves, on every pull request, that the deploy's
      # wheels-only hashed install works on this Python
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: go test ./internal/docgen/ ./tests/ci/ -count=1
      - run: mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: '1'
          PORT49_DOCS_BANNER: ${{ steps.publish.outputs.banner }}
      - run: PORT49_DOCS_SITE=site go test ./tests/ci/ -run '^TestTheBuiltSite' -count=1

  # One copy of the site per version lives on the gh-pages branch (mike), and Pages serves that
  # branch through GitHub's own pages-build job, so this job needs no Pages permission, no OIDC
  # token and no environment. It is the one job that writes the repository, and it has two parts that
  # never share a token:
  #   - `site` decides, builds with mike and commits to the local gh-pages branch. The docs toolchain
  #     (pip-installed code, mkdocs, mike) runs here, and no GH_TOKEN is in this step's environment.
  #     Removing a variable from a child's environment would not be enough: a child can read its
  #     parent's, and can plant git hooks or config that a later git command would run.
  #   - `push` holds the token and runs only git. It pushes from a clean bare repository fetched from
  #     the workspace, with hooks and the runner's git configuration off, so nothing the toolchain
  #     wrote in the workspace runs with the token. It pushes gh-pages, never forced.
  #
  # Two deploys can overlap, a tag's and the main push after it, so nothing decided earlier is trusted:
  # `site` takes the version and aliases from docspublish run here, not from the build job (whose
  # answer can be stale by now), after fetching gh-pages and then the tags, so every tag whose deploy is
  # already on the gh-pages it saw is in the tag list it decides from. A deploy that still loses the
  # race for the branch fails red ("another deploy moved gh-pages; re-run this job"): it is not retried,
  # because a retry would have to run the toolchain again beside the token. The group is per ref: one
  # group for all refs would let a newer pending main deploy cancel a pending tag deploy.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes "--only-binary=:all:" -r packaging/requirements-docs.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          set -eu
          # gh-pages first, then the tags: a tag whose deploy is already in the gh-pages fetched here
          # was pushed before this fetch of tags, so it is in the list docspublish decides from
          git fetch --force origin '+refs/heads/gh-pages:refs/heads/gh-pages' || echo "no gh-pages branch yet"
          git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          out=$(go run ./tests/ci/cmd/docspublish -ref "$GITHUB_REF")
          publish=$(printf '%s\n' "$out" | sed -n 's/^publish=//p')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" != true ]; then
            echo "docspublish: nothing to publish for $GITHUB_REF"
            exit 0
          fi
          banner=$(printf '%s\n' "$out" | sed -n 's/^banner=//p')
          version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')
          aliases=$(printf '%s\n' "$out" | sed -n 's/^aliases=//p')
          echo "deploying $version with aliases: $aliases"
          PORT49_DOCS_BANNER="$banner" mike deploy --update-aliases --branch gh-pages --remote origin "$version" $aliases
          # the site root redirects to latest, so a link to /port49/latest/... is the stable deep link
          mike set-default --branch gh-pages --remote origin latest
          # the root 404 sends pre-versioning links to latest; the root llms.txt is latest's
          wt="$RUNNER_TEMP/gh-pages"
          git worktree add "$wt" gh-pages
          cp .github/docs-404.html "$wt/404.html"
          cp "$wt/latest/llms.txt" "$wt/llms.txt"
          git -C "$wt" add 404.html llms.txt
          git -C "$wt" diff --cached --quiet || git -C "$wt" commit -q -m "docs: root 404 and llms.txt"
          git worktree remove --force "$wt"
      - id: push
        if: steps.site.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # only git runs here, from a clean bare repository: no workspace hooks or config, and none of
          # the runner's, can run with the token
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          t=$(mktemp -d)
          git init -q --bare "$t"
          git -C "$t" fetch -q "$GITHUB_WORKSPACE" gh-pages:gh-pages
          if ! git -C "$t" -c core.hooksPath=/dev/null -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages; then
            echo "another deploy moved gh-pages; re-run this job" >&2
            exit 1
          fi
