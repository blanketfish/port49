# The Python library's and the Ansible lookup's unit tests (plan 9d), on the
# floor (3.10, decision 46 ruling 14) and the newest stable Python. No YubiKey,
# TPM or broker: test_real_cli builds ./cmd/port49 and stubs the agent socket.
name: python
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    strategy:
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}"}
      - run: make test-python
  # The same, under a real ansible-core: the lookup's real-ansible tests, and the README's
  # mint-once play under network_cli (no device; it connects to a closed local port). The
  # versions are the L66 lab's, ansible-pylibssh included, so network_cli runs libssh here as there;
  # libnss-wrapper gives libssh a private passwd home (it ignores $HOME).
  real-ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      # 3.14 is the newest Python ansible-pylibssh 1.4.0 has wheels for; "3.x" would move past it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: sudo apt-get update && sudo apt-get install -y libnss-wrapper
      # hash-pinned, like the release's: packaging/requirements-ci.txt (make requirements-release)
      - run: python -m pip install --require-hashes -r packaging/requirements-ci.txt
      - run: ansible-galaxy collection install -p "$RUNNER_TEMP/collections" ansible.netcommon==8.7.1 ansible.utils==6.1.1 arista.eos==12.3.0
      - run: PORT49_TEST_ANSIBLE_PLAYBOOK="$(command -v ansible-playbook)" make test-python
        env:
          PORT49_TEST_ANSIBLE_COLLECTIONS: ${{ runner.temp }}/collections
  # What the release builds, built on every pull request: a tag is the wrong time to find the wheel
  # or the collection does not build. Nothing is published or uploaded.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r packaging/requirements-release.txt
      - run: python -m build --no-isolation clients/python
      - run: ansible-galaxy collection build clients/ansible/ansible_collections/port49/client --output-path galaxy-dist
