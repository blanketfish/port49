# Secret scanning (.gitleaks.toml): the pinned gitleaks binary, checksum-verified, over the
# full history and the working tree. --redact so a finding's value never reaches the log.
# `make leaks` is the same scan by hand; the Makefile holds the single version and sha256 pin.
name: leaks
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - run: make leaks
      # The same rule over the tracked files, as a Go test: no session link or trailer in the tree.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go test ./tests/ci/ -run SessionLink -count=1
      # gitleaks reads patches, not commit messages: the pull request's own commits go through the
      # same rule. Old history keeps its trailers (not rewritten), so only base..head is checked.
      - if: github.event_name == 'pull_request'
        run: go run ./tests/ci/cmd/sessionmsg -range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
