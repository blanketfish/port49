# The free-image tier (plan 11b): SR Linux, the one lab image that may run on a hosted runner
# (vendor images are never redistributed). runs-on is one line; beehive's self-hosted label is
# the other choice. Triggers per the 2026-10-19 ruling: dispatch and release tags. Moving to
# path-filtered PRs later is this one change to `on:`:
#   pull_request: {paths: ['internal/platform/**', 'internal/daemon/**', 'tests/qual/**']}
name: lab-free
on:
  workflow_dispatch:
  push: {tags: ['v*']}
permissions: {contents: read}
jobs:
  srlinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {contents: read}
    # bash -eo pipefail: a step fails on its command, not on the secret filter it is piped through.
    # The job log is world-readable once the repository is public, so every lab step's output goes
    # through tests/qual/secret-filter.sh (the filter vet.sh reads lab logs through).
    defaults: {run: {shell: bash}}
    env:
      CLAB_VERSION: 0.71.1
      # From the v0.71.1 release's checksums.txt (containerlab_0.71.1_linux_amd64.deb).
      CLAB_DEB_SHA256: f6dcdd63a389b4bbaa1d94a2f67c8816b8afdf39ada8146ad0fc800e762719f8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - name: Prove the lab harness can run here
        run: |
          sudo -n true
          command -v tcpdump || sudo apt-get install -y tcpdump
          sudo -n tcpdump --version
          docker info >/dev/null
          id -nG | tr ' ' '\n' | grep -qx docker || sudo usermod -aG docker "$USER"
      - name: Install containerlab, pinned and checksummed
        run: |
          deb="containerlab_${CLAB_VERSION}_linux_amd64.deb"
          curl -fsSLO "https://github.com/srl-labs/containerlab/releases/download/v${CLAB_VERSION}/${deb}"
          echo "${CLAB_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
      - run: docker pull ghcr.io/nokia/srlinux:26.7.2-519
      - run: make build
      # Two processes, each with its own TestMain teardown: in one, TestL76 leaves srl1 up
      # and TestQualify's single-occupant docker ps check refuses to run (re-review I-C).
      - name: L76
        run: sg docker -c "PORT49_LAB_REMEASURE=L76 PORT49_LAB_PLATFORMS=srlinux go test -tags lab ./tests/lab/ -run '^TestL76$' -count=1 -v -timeout 40m" 2>&1 | bash tests/qual/secret-filter.sh
      - name: The conformance run
        run: sg docker -c "PORT49_LAB_QUALIFY=1 PORT49_LAB_PLATFORMS=srlinux go test -tags lab ./tests/lab/ -run '^TestQualify$' -count=1 -v -timeout 40m" 2>&1 | bash tests/qual/secret-filter.sh
      - run: go run ./tests/lab/cmd/notediff -fail-on-change -note tests/lab/results/L76-nokia_srlinux.md 2>&1 | bash tests/qual/secret-filter.sh
      # The QUAL note holds the golden's outcomes (break-glass under ERROR among them), which the
      # stimulus check below does not compare; the same exactly-once glob as the evidence directory.
      - name: The conformance note matches the committed one
        run: |
          shopt -s nullglob
          notes=(tests/lab/results/QUAL-*-nokia_srlinux.md)
          if [ "${#notes[@]}" -ne 1 ]; then
            echo "expected exactly one tests/lab/results/QUAL-*-nokia_srlinux.md note, found ${#notes[@]}: ${notes[*]}" >&2
            exit 1
          fi
          go run ./tests/lab/cmd/notediff -fail-on-change -note "${notes[0]}" 2>&1 | bash tests/qual/secret-filter.sh
      # TestQualify names the directory QUAL-<devicemock.Slug(version)>-<platform>; a glob that
      # must match exactly once survives a version-string change and fails loudly otherwise.
      - name: The generated stimulus matches the committed profile
        run: |
          shopt -s nullglob
          dirs=(tests/lab/evidence/QUAL-*-nokia_srlinux)
          if [ "${#dirs[@]}" -ne 1 ]; then
            echo "expected exactly one tests/lab/evidence/QUAL-*-nokia_srlinux directory, found ${#dirs[@]}: ${dirs[*]}" >&2
            exit 1
          fi
          go run ./tests/qual/cmd/genprofile -check -evidence "${dirs[0]}" 2>&1 | bash tests/qual/secret-filter.sh
