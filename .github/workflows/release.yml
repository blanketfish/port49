# The release (plan 12b, Task 12): on a v* tag and nothing else. It checks the tag against
# every version file, builds and publishes the packages, the image and the chart, then builds
# the Python and Galaxy artifacts without any token and publishes them from jobs that only
# download. No step pushes anywhere until a tag is pushed, and the first tag is Ryan's.
#
# Every job holds only what it needs; only goreleaser, image and pypi hold id-token: write
# (the first two for provenance attestations, pypi for trusted publishing), and
# tests/ci/workflows_test.go holds that to this file. A re-run after a later job failed is safe:
# the GitHub release is replaced by GoReleaser's own rules, the registries take the same digest,
# PyPI is skip-existing, and Galaxy's "already exists" is success.
name: release
on:
  push: {tags: ['v*']}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go run ./tests/ci/cmd/versioncheck -tag "$GITHUB_REF_NAME"
      - run: make vet
      - run: make check-static
      - run: make check-darwin

  goreleaser:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: write, attestations: write, id-token: write}
    steps:
      # The one checkout that keeps its credentials: GoReleaser creates the GitHub release with
      # the job's token, and reads the whole history for its changelog.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      # The pinned, sha256-checked binary, never an action that fetches a release.
      - run: make release-packages
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, packages: write, attestations: write, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      # :latest follows a release, never a pre-release (a version with a hyphen).
      - id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/rhwendt/port49:${version}"
            case "$version" in *-*) ;; *) echo "ghcr.io/rhwendt/port49:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: port49
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-name: ghcr.io/rhwendt/port49
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      # bin/helm is the sha256-pinned binary the chart task's Makefile target fetches.
      - run: make bin/helm
      - run: bin/helm package deploy/helm/port49
      - run: echo "$GITHUB_TOKEN" | bin/helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - run: bin/helm push port49-*.tgz oci://ghcr.io/rhwendt/charts

  build-python:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r packaging/requirements-release.txt
      - run: python -m build --no-isolation clients/python
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: {name: python-dist, path: clients/python/dist/}

  pypi:
    needs: [build-python, goreleaser, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: {name: python-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with: {packages-dir: dist, skip-existing: true}

  build-galaxy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r packaging/requirements-release.txt
      - run: ansible-galaxy collection build clients/ansible/ansible_collections/port49/client --output-path galaxy-dist
      # The publish job installs ansible-core from the same hashes, so the file travels with the build.
      - run: cp packaging/requirements-release.txt galaxy-dist/
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: {name: galaxy-dist, path: galaxy-dist/}

  galaxy:
    needs: [build-galaxy, goreleaser, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: galaxy
    permissions: {}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: {name: galaxy-dist, path: .}
      # bash -eo pipefail: a failed publish fails the step unless Galaxy says this version exists.
      - run: |
          pip install --require-hashes -r requirements-release.txt
          ansible-galaxy collection publish port49-client-*.tar.gz --token "$GALAXY_API_KEY" 2>&1 | tee publish.log || grep -q "already exists" publish.log
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
