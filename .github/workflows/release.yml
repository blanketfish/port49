# The release (plan 12b, Task 12): on a v* tag and nothing else. It checks the tag against
# every version file, builds and publishes the packages, the image and the chart, then builds
# the Python and Galaxy artifacts without any token and publishes them from jobs that only
# download. No step pushes anywhere until a tag is pushed, and the first tag is Ryan's.
#
# Every job holds only what it needs; only goreleaser, image, chart and pypi hold id-token: write
# (the first three for provenance attestations, pypi for trusted publishing), and
# tests/ci/workflows_test.go holds that to this file. The release stays a draft until the last job,
# which waits for every publisher, so a user never sees a release whose image, chart or Python
# package is missing. A re-run after a later job failed is safe: .goreleaser.yaml sets
# replace_existing_draft and replace_existing_artifacts, so the draft and its assets are replaced,
# the registries take the same digest, PyPI is skip-existing, and Galaxy's "already exists" is success.
name: release
on:
  push: {tags: ['v*']}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      # The whole history, so the next step can tell whether the tag's commit is on main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      # A tag on an unreviewed branch commit never publishes.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - run: go run ./tests/ci/cmd/versioncheck -tag "$GITHUB_REF_NAME"
      - run: make vet
      - run: make check-static
      - run: make check-darwin

  goreleaser:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions: {contents: write, attestations: write, id-token: write}
    steps:
      # The whole history, for GoReleaser's changelog. No credentials are kept: GoReleaser
      # creates the release through the API with GITHUB_TOKEN from the step's env.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      # The pinned, sha256-checked binary, never an action that fetches a release.
      # The release is a draft until its provenance exists.
      - run: make release-packages
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

  image:
    # After goreleaser: a failed draft or attestation stops the pushes.
    needs: [check, goreleaser]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions: {contents: read, packages: write, attestations: write, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      # :latest follows a release, never a pre-release (a version with a hyphen).
      - id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/rhwendt/port49:${version}"
            case "$version" in *-*) ;; *) echo "ghcr.io/rhwendt/port49:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: port49
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-name: ghcr.io/rhwendt/port49
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [check, goreleaser]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions: {contents: read, packages: write, attestations: write, id-token: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      # bin/helm is the sha256-pinned binary the chart task's Makefile target fetches.
      - run: make bin/helm
      - run: bin/helm package deploy/helm/port49
      - run: echo "$GITHUB_TOKEN" | bin/helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      # helm prints the pushed manifest's digest; the attestation names exactly that digest.
      - id: push
        run: |
          set -euo pipefail
          bin/helm push port49-*.tgz oci://ghcr.io/rhwendt/charts 2>&1 | tee push.out
          echo "digest=$(sed -n 's/^Digest: //p' push.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-name: ghcr.io/rhwendt/charts/port49
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-python:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r packaging/requirements-release.txt
      - run: python -m build --no-isolation clients/python
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: {name: python-dist, path: clients/python/dist/}

  pypi:
    needs: [check, build-python, goreleaser, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: {name: python-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with: {packages-dir: dist, skip-existing: true}

  build-galaxy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r packaging/requirements-release.txt
      - run: ansible-galaxy collection build clients/ansible/ansible_collections/port49/client --output-path galaxy-dist
      # The publish job installs ansible-core from the same hashes, so the file travels with the build.
      - run: cp packaging/requirements-release.txt galaxy-dist/
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with: {name: galaxy-dist, path: galaxy-dist/}

  galaxy:
    needs: [check, build-galaxy, goreleaser, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: galaxy
    permissions: {}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: {name: galaxy-dist, path: .}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      # No token in this step's environment: pip never sees it.
      - run: pip install --require-hashes -r requirements-release.txt
      # The token reaches ansible-galaxy as its "public" server's token, in this step's env
      # only, never on argv. A failed publish fails the step unless Galaxy's refusal says this
      # version exists. The line shape is read from ansible-core 2.21.4's source (display.py
      # prefixes "[ERROR]: "; api.py:88 and :114 rewrite the server URL to .../api/ before :675 builds
      # the message, and :210 adds the rest); the Message text after
      # "HTTP Code: 400" is UNVERIFIED until a real re-run (12b report).
      - run: |
          set +e
          ansible-galaxy collection publish port49-client-*.tar.gz > publish.log 2>&1
          rc=$?; cat publish.log; [ "$rc" -eq 0 ] || grep -qE '^\[ERROR\]: .*Error when publishing collection to public \(https://galaxy\.ansible\.com/api/\) \(HTTP Code: 400, Message: [^)]*already exists' publish.log
        env:
          ANSIBLE_GALAXY_SERVER_LIST: public
          ANSIBLE_GALAXY_SERVER_PUBLIC_URL: https://galaxy.ansible.com/
          ANSIBLE_GALAXY_SERVER_PUBLIC_TOKEN: ${{ secrets.GALAXY_API_KEY }}

  # The one place the release stops being a draft: after the packages, image, chart, PyPI and Galaxy
  # have all published. It builds and fetches nothing.
  publish:
    needs: [check, goreleaser, image, chart, pypi, galaxy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
