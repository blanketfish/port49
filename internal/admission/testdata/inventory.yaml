devices:
  - name: leaf-01
    platform: arista_eos
    addresses: [10.20.0.7, 10.20.255.7]
    attributes: {site: dc1, role: leaf}
  - name: lab-sw-1
    platform: arista_eos
    addresses: [10.99.0.5]
    attributes: {env: lab}
  - name: pinned-1
    platform: generic
    addresses: [10.20.0.9]
    key_ref: special_key

key_groups:
  - {match: {cidr: 10.0.0.0/8},        key_ref: prod_key}
  - {match: {cidr: 10.99.0.0/16},      key_ref: lab_cidr_key}
  - {match: {attributes: {env: lab}},  key_ref: lab_key}
