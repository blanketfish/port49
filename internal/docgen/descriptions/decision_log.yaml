_description: "The fields of the decision log, one line per decision, and how to query it."
_intro: |
  port49 writes one JSON record for every decision it makes, and each record is one line of the log. The log is
  port49's own record of what it decided, for whom and against which rule. It is separate from the accounting
  records a device sends, which report what a device did. Every key is snake_case.

  Every record has the same envelope: `ts`, `event` and, for a decision, `verdict` and `reason`. The blocks
  that follow (`auth`, `device`, `session` and the rest) appear on the records they apply to. Most fields are
  left out of a record when they have no value, so a query must treat a missing key as "not set".

  A record that names its policy blob can be replayed offline and must give the same verdict. The
  [reason codes](reason-codes.md) page lists every value of `reason`.
ts: "When the record was written, as an RFC 3339 timestamp."
event: "What the record is about. The two events tables list each value: the decision events and what they decide, then the report events."
verdict: "`permit` or `deny`. Absent on the report events, which decide nothing, and on an `explain` that answered with a mint error."
reason: "Why the verdict is what it is: one value of the closed reason vocabulary."
principal: "Who the decision was about."
auth.method: "How the caller authenticated."
auth.credential_sha256: "The SHA-256 of the credential presented on the wire. The credential itself is never logged. A mint record has no value here and carries `mint.token_sha256` for each token it issued."
auth.fingerprint: "The SHA-256 of a client certificate that the trust anchor verified and the broker then refused. It says whose certificate it was. Identity, not a secret."
auth.directory.source: "Where the directory membership this decision used came from: `fresh` (read from a server for this request) or `grace` (the stored membership, still inside the grace period)."
auth.directory.verified_at: "When the membership was last verified against the directory."
auth.directory.server: "The directory server the membership was read from."
auth.directory.site: "The directory site the membership was read from."
auth.oidc.issuer: "The issuer of the verified OIDC token."
auth.oidc.sub: "The subject of the verified OIDC token."
auth.oidc.sid: "The identity provider's own session id, when the token carries one."
auth.oidc.amr: "The token's authentication methods references. Recorded because how someone authenticated cannot be established afterwards. No decision reads it."
auth.oidc.acr: "The token's authentication context class reference. Recorded and read by nothing."
auth.oidc.auth_time: "When the identity provider says the person authenticated."
auth.k8s.cluster: "The configured name of the cluster whose verifier accepted the service account token."
auth.k8s.issuer: "The issuer of the verified service account token."
auth.k8s.sub: "The subject of the verified service account token."
auth.k8s.serviceaccount_uid: "The UID of the service account."
auth.k8s.pod: "The name of the pod the token was issued to."
auth.k8s.pod_uid: "The UID of the pod the token was issued to."
auth.k8s.node: "The node the pod ran on, when the token names one."
auth.k8s.jti: "The token's id, when it carries one."
auth.directory_password.amr: "The methods a directory-password sign-in used."
auth.directory_password.auth_time: "When the sign-in authenticated."
auth.directory_password.entry_sha256: "A SHA-256 of the directory entry that signed in. Never the password or the code."
device.nas: "The device's address as port49 saw it."
device.name: "The device's name in the inventory."
device.platform: "The device's platform in the inventory."
device.key_ref: "The key that validated the exchange. Set on every record of a validated exchange and on no other. A record from the TLS listener has none."
device.key_version: "The version of that key. `port49 keys status` reads a rotation's phase-out from it."
device.transport: "`tls` on a record from the TACACS+ over TLS (RFC 9887) listener. Absent on the RFC 8907 listener's records."
device.cert_sha256: "On a TLS record, the SHA-256 of the device's verified leaf certificate."
session.ctx_id: "The id of the context (the session state port49 holds for a login). It joins the records of one login."
session.username: "The username the device sent. Left empty when the device sent a token-shaped username, which the log never carries."
session.username_redacted: "`true` when the device sent a token-shaped username and it was left out of `session.username`."
session.replaced_ctx_id: "On a `redeem` that replaced an existing context for the same device and username, the id of the displaced context. A second login by the same principal joins the context and sets nothing here."
session.replaced_unreadable: "`true` when the replaced context could not be opened (sealed under a key that has left the two-key window, or failing authentication), so its id cannot be named."
session.revoked_at: "On a `redeem` refused `credential_revoked`, when the revocation that refused it was made."
session.privilege_clamped.from: "The privilege level the context held before a login joined it."
session.privilege_clamped.to: "The level it was lowered to, which is the newest login's ceiling. Another window's next command above this level is denied `privilege_exceeded`."
session.auth_time: "On a `refresh` record that moved it, the session's new authentication time."
session.session_expires: "On a `refresh` record that moved it, the session's new ceiling; on a `redeem` refused `session_expired`, the ceiling that refused it."
session.unreached: "`true` on a `refresh` record for a context on a platform that never asks about a command, or on a device whose inventory entry gives no platform. The live session keeps what it had."
session.port: "The port (tty) the device reported on this exchange."
session.rem_addr: "The remote address the device reported on this exchange."
session.privilege: "On `authorize_session` and `authorize_command`, the privilege level in the request's header, which is the level the device asked at. On other events, what that event says: a refresh's is the context's level and a redeem's is the login's start level."
session.held_privilege: "The privilege level port49 held for the context when the request arrived, before any raise this request makes. Present on authorize records whose context was read and is this user's, denials included. Compare it with `session.privilege` to see what the device asked for against what port49 held."
request.service: "The `service` attribute of the request. Recorded on every `authorize_session` and `authorize_command` record, denials included, so it can be grouped by. It is checked against the platform's session services and nothing else."
request.raw: "The request's arguments as the device sent them, after redaction: a word that matches a secret rule is replaced with `«redacted»` first, and `request.redacted` says so."
request.vector: "The request's command as a list of words."
request.redacted: "`true` when words were replaced with `«redacted»` before the record was written. A secret is never logged."
packet_fields.action: "The authentication action, as a name. Authentication requests only."
packet_fields.authen_type: "The authentication type, as a name."
packet_fields.service: "The authentication service, as a name."
packet_fields.authen_method: "The authentication method, as a name. Authorization and accounting requests only."
packet_fields.priv_lvl: "The privilege level in the request header."
reply.attributes: "The attributes a permitted authorization returned to the device, as sent, with every placeholder filled."
flags: "On an `account` record, the accounting flags the device sent, such as `stop`."
attribution: "On an `account` record, whether the record was tied to a login port49 knows. `resolved`: it was. `foreign`: a record for a session whose start port49 never saw, on a device where it did watch this user's other sessions begin (a local fallback, a console login, or a device-local account with the same name); this is the value to alert on, and `port49_accounting_attributions_total{attribution=\"foreign\"}` counts it. `system`: the device acting on its own behalf. `unattributed`: none of these."
task_id: "The `task_id` of an accounting record."
record.raw: "On an `account` record, the accounting arguments as the device sent them, after redaction: a word that matches a secret rule is replaced with `«redacted»` before the record is written, and `record.redacted` says so."
record.vector: "On an `account` record, the command as a list of words."
record.redacted: "`true` when words were replaced before the accounting record was written, so no secret reaches the disk."
record.priv_lvl: "The privilege level in the accounting record."
record.start_time: "The device's start time for the task, when it sent one."
record.stop_time: "The device's stop time for the task, when it sent one."
record.elapsed_time: "The device's elapsed time for the task, when it sent one."
mint.token_sha256: "The SHA-256 of each token the mint issued. The token itself never appears in the log."
mint.ttl_seconds: "How long the minted tokens live, in seconds."
mint.blob: "The hash of the policy blob the mint resulted in."
policy.bundle: "The policy version the blob was compiled from."
policy.blob: "The hash of the compiled blob the decision was made against. With `policy.bundle`, it is what makes the record replayable."
policy.subject: "The subject that matched the principal."
policy.subjects: "Every subject that matched, sorted, when the principal matches more than one. `policy.subject` is then absent."
policy.grants.[].scope: "On a mint record, the scope of a grant that selected the device."
policy.grants.[].roles: "The roles that grant gives."
policy.grants.[].expires: "When the grant stops matching. Empty means never."
policy.matched_deny.rule: "The rule's terms as written."
policy.matched_deny.specificity: "The specificity tuple the rule scored against this command."
policy.matched_deny.role: "The role that carries the rule. The rule is the deny that decided a `no_permit_dominates_deny`, or the most specific deny a permit overrode."
policy.matched_permits.[].rule: "The rule's terms as written."
policy.matched_permits.[].specificity: "The specificity tuple the rule scored against this command."
policy.matched_permits.[].role: "The role that carries the rule. The permits that matched the command are listed most specific first, and the first decided a permit."
policy.stage: "The 1-based pipeline stage that a `pipe_stage_denied` refused. The stage's words are in `request.raw`."
blob.hash: "The hash that names the blob."
blob.body: "On a `blob` record, the compiled blob whole, emitted once per hash, so replay depends on the log alone."
blob.redacted: "`true` when rule text in the body was redacted before it was logged. The body is then not the blob the hash names, and replay reports every record that names it unverifiable."
unvalidated.source: "The source address of a packet no key validated."
unvalidated.diagnosis: "Why the packet or connection is on this record. `no_known_key_matches`: no key of the device's `key_ref` validates it. `matches_retired`: a retired key validates it, and `unvalidated.version` says which. `unencrypted_refused`: the packet was not obfuscated. `not_tacacs`: the header is not TACACS+. `unadmitted_source`: the source address is not in the inventory. `malformed_after_validation`: the key validated and the body did not decode. `device_quarantined`: the device is admitted but quarantined by policy. `admission_refused`: the device is in the inventory and admission refused it. `admission_withdrawn`: a reload renamed, re-keyed or re-platformed the device of an open connection. `transport_mismatch`: the device reached the listener it does not speak. `tls_refused`: the TLS listener refused or ended the connection, and `unvalidated.tls_outcome` says why. `obfuscated_over_tls`: a packet over TLS with the unencrypted flag clear."
unvalidated.key_ref: "The key tried, when there was one."
unvalidated.version: "The version of the key (the numbered version within the device's `key_ref`) that the packet matched, or that the connection speaks. During a key rotation, a `matches_retired` record carries the retired version a device is still using, which is how you find the devices that have not moved to the new key. Absent where no key matched."
unvalidated.type: "The packet type in the header."
unvalidated.seq_no: "The sequence number in the header."
unvalidated.session_id: "The session id in the header."
unvalidated.length: "The body length in the header."
unvalidated.body_sha256: "The SHA-256 of the body. The body itself is never logged."
unvalidated.transport: "`tls` on a record from the TLS listener."
unvalidated.tls_outcome: "On a record with `diagnosis: tls_refused`, why the handshake was refused. See the values below."
unvalidated.detail: "A bounded, printable note on a record from the TLS listener, or on a `transport_mismatch` record from either listener (which names the transport the device record says and the listener it reached). It is never a body."
unvalidated.cert_sha256: "On a record with `diagnosis: tls_refused`, the SHA-256 of the certificate the device sent, where it sent one."
server_msg: "The message the reply carried to the person at the device. A denial's names the rule that decided and does not echo the command."
gap.stage: "Where accounting records were dropped: `offer_refused` (answered `ERROR`, so the device may send the record again), `drain_unparseable` or `drain_set_aside` (answered `SUCCESS` and not in the log)."
gap.records: "How many accounting records were dropped at this stage."
gap.since: "The earliest arrival among the dropped records, as far as the spool knows it."
change.kind: "What changed. Only security-relevant changes are written: `device_added` (a device added and admitted), `admission_changed` (a device already in the inventory becoming admitted), `address_added` (an address added to a device already in the inventory), `key_ref_changed`, `transport_changed` and `platform_changed` (a device's key assignment, `transport` or `platform` changed), and `scope_joined` or `scope_left` (a device entering or leaving a scope with `security_log: true`)."
change.scope: "The scope involved, when the change names one."
change.address: "The address involved, when the change names one."
change.from: "The earlier value, on `key_ref_changed`, `transport_changed`, `platform_changed` and `admission_changed`."
change.to: "The later value, on those kinds and on `device_added`, where it is `admitted`."
change.from_bundle: "The policy version before the swap that made the change."
change.to_bundle: "The policy version after it."
forget.entry_id: "The id of the directory entry the principal was pinned to."
forget.dn: "The distinguished name of that entry."
forget.verified_at: "When the entry was last verified or refused."
forget.refused: "`true` when the last answer for the entry was a refusal."
forget.origin: "Who asked for the principal to be forgotten."
sweep.scope: "On a mint record made through a sweep page, the scope the sweep walked."
sweep.after: "The page's cursor."
revocation.by: "What the revocation was made by, such as a principal or a certificate."
revocation.issuer: "The issuer of a certificate revoked by serial."
revocation.serial: "The serial of a certificate revoked by serial."
revocation.oidc_issuer: "The OIDC issuer of a session or subject ended by a back-channel logout or a revocation by `sid` or `sub`."
revocation.sid: "The OIDC session id that was ended."
revocation.sub: "The OIDC subject that was ended."
revocation.principals: "Every principal a logout reached, when its owner record named more than one. The record's `principal` is then the first."
revocation.device: "The device a revocation was limited to."
revocation.username: "The username a revocation was limited to."
revocation.at: "When the revocation was made."
revocation.origin: "Who made the revocation."
revocation.contexts: "How many live contexts it reached. Zero is left out."
revocation.token_keys: "How many token keys it reached. Zero is left out."
revocation.connections: "How many connections it ended. Zero is left out."
revocation.unreached.[].device: "A live context the revocation could not reach: its device."
revocation.unreached.[].username: "A live context the revocation could not reach: its username."
revocation.saved: "Whether `broker.revocations_file` was written. Present for a standing mark only: absent for a self or key revocation, which writes none, and on a broker that keeps no `revocations_file`."
revocation.error: "What went wrong, when something did."
explain.asked_by: "The principal that asked the hypothetical question."
explain.asked_by_fingerprint: "The fingerprint of the certificate the asker presented."
explain.command: "`true` when the question was about a command. The command itself is never recorded."
explain.mint_error: "The mint error the broker would have answered instead of a token. The record then has no verdict."
certificate.serial: "The serial of the certificate issued, as `port49 revoke --cert-serial` takes it."
certificate.issuer: "The distinguished name of the CA that issued it."
certificate.fingerprint: "Its SHA-256 fingerprint."
certificate.not_after: "When it expires."
per_login_mfa.accept: "On a mint or refresh record under a per-login requirement, the proof methods the requirement accepts."
per_login_mfa.reuse_for_seconds: "How long a proof is reused for, in seconds."
per_login_mfa.levels: "The privilege levels the requirement covers."
per_login_mfa.method: "The method of the proof that covered the record, or of the proof a `per_login_mfa` record judged."
per_login_mfa.proved_at: "When the covering proof was made."
per_login_mfa.reused: "`true` when an earlier proof was reused."
per_login_mfa.challenge_sha256: "On a `per_login_mfa` record, the SHA-256 of the challenge. The challenge itself is never logged."
admin.operation: "On an `admin_touch` record, the operation the proof was for."
admin.target: "The operation's target, as the challenge shows it."
admin.challenge_sha256: "The SHA-256 of the challenge. The challenge, the signature and the attestation are never logged."
admin.why: "For a refusal or an unavailable answer, a fixed cause."
sign_in.source: "The source network a directory-password sign-in came from."
sign_in.failed: "On a refusal, which check failed."
sign_in.skew_seconds: "For a clock too far off, by how many seconds."
sign_in.directory_result: "The directory's result code, on a refusal that has one."
sign_in.directory_data: "The directory's diagnostic data, on a refusal that has one. Never the name typed, the password or the code."
second_factor_reset.enrolled_at: "When the enrollment that was cleared was made."
second_factor_reset.enrolled_from: "Where it was made from."
second_factor_reset.reopen_until: "Until when enrollment is open again. Absent on a store creation."
second_factor_reset.all: "`true` for a reset of every enrollment."
second_factor_reset.created: "`true` when the record is the creation of the enrollment store."
second_factor_reset.origin: "Who made the reset."
sign_in_unlock.failures: "The failed-attempt count the answering broker held. Absent when its session store did not answer the clear: the unlock is then in force but the count is unknown, which is not zero."
sign_in_unlock.origin: "Who cleared the count."
enrollments_import.records: "How many enrollment records the import wrote."
enrollments_import.exported_at: "When the imported export was made."
enrollments_import.replaced: "`true` when the import replaced an existing store."
enrollments_import.origin: "Who ran the import."
index_error: "What a failed session-index write cost, on the record for the session that lost it. That session is missing from the index, so a later revocation cannot find it. This is different from `revocation.unreached`, which lists live contexts a revocation found and could not reach."
tls_outcome.ok: "The handshake completed and the device's certificate was admitted. Counted after the status check passes."
tls_outcome.resumed: "The handshake resumed an earlier TLS session and the device was admitted."
tls_outcome.version_refused: "The ClientHello offered no TLS 1.3."
tls_outcome.no_client_certificate: "The device sent no certificate."
tls_outcome.unknown_ca: "Its chain reaches no `client_ca_file` anchor."
tls_outcome.certificate_expired: "A certificate in its chain is expired or not yet valid."
tls_outcome.certificate_invalid: "Any other path error, a serverAuth-only leaf included."
tls_outcome.certificate_revoked: "A certificate in its chain is revoked."
tls_outcome.status_unavailable: "Its status could not be established under `on_unavailable: refuse`. A decline: the window stands until it lapses."
tls_outcome.identity_mismatch: "The leaf does not name the device its source address is."
tls_outcome.sni_mismatch: "The ClientHello asked for a server name not in `server_names`. A decline: the window stands until it lapses."
tls_outcome.early_data_refused: "The ClientHello carried `early_data` (RFC 9887 section 5.1.2)."
tls_outcome.handshake_timeout: "No handshake within `handshake_timeout`."
tls_outcome.handshake_failed: "Anything else: a bad signature, a client abort."
