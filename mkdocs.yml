site_name: port49
# The versions are published side by side (mike): /dev/, /<major>.<minor>/ and the alias /latest/. mike
# appends the version it builds to site_url, so this is the bare root. internal/docgen adds latest/ to
# the absolute URLs it writes (llms.txt).
site_url: https://blanketfish.github.io/port49/
repo_url: https://github.com/blanketfish/port49
docs_dir: docs/site
# The evidence tables are included into the device pages; they are not pages of their own.
exclude_docs: |
  _snippets/
strict: true

# Listing a plugin replaces the default list, so search stays named. Every version's canonical link names
# /latest/, so a search engine indexes one copy of a page, not one per release; Material draws the
# version dropdown (extra.version below).
plugins:
  - search
  - mike:
      canonical_version: latest
      # latest is a real copy of the release it names, not a symlink, so it is served the same on any host
      alias_type: copy
      # version_selector stays at its default (true): Material's base.html draws its dropdown only when
      # the mike plugin's selector is on, and mike adds no selector of its own for the material theme.

theme:
  name: material
  # No third-party font requests: the site loads nothing from outside its own origin.
  font: false
  custom_dir: docs/overrides
  # Light and dark: the first scheme follows the reader's system setting, the toggle overrides it. The
  # icons are Material's own, served from the site, so nothing is requested from another origin.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # The page is wider than Material's default (docs/site/stylesheets/extra.css: width only, no color).
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight

extra:
  # Material's version dropdown reads versions.json, which `mike deploy` writes on the gh-pages branch
  # (.github/workflows/docs.yml); `alias: true` lists latest beside the release it points at.
  version:
    provider: mike
    alias: true
    # A page of any version other than latest shows Material's outdated-version notice (docs/overrides/main.html).
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # No mermaid fence: Material loads mermaid.js from a CDN, which `font: false` exists to avoid.
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# With `strict: true` each of these warnings fails the build: this is the link check.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

