[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "port49"
version = "0.1.0"
description = "port49 device tokens for Python: identity, mint, sweep, retry, and Netmiko over the port49 CLI"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/blanketfish/port49"
Repository = "https://github.com/blanketfish/port49"
Issues = "https://github.com/blanketfish/port49/issues"

[project.optional-dependencies]
netmiko = ["netmiko>=4.7"]

[tool.setuptools.packages.find]
where = ["src"]
