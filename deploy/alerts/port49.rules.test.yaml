# promtool unit tests for port49.rules.yaml (plan 12c, Task 5): each rule fires on one synthetic
# series and stays quiet on another. `make alerts-check` runs them.
rule_files: [port49.rules.yaml]
evaluation_interval: 1m
tests:
  # port49_target_down
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49-broker\",instance=\"b\"}", values: "0+0x10"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_target_down
        exp_alerts:
          - exp_labels: {job: "port49-broker", instance: "b", severity: "page"}
            exp_annotations:
              summary: "A port49d or broker target is not answering its scrape: up is 0 for it."
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49d\",instance=\"a\"}", values: "1+0x10"}
      - {series: "up{job=\"node\",instance=\"n\"}", values: "0+0x10"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_target_down
        exp_alerts: []
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49d\",instance=\"a\"}", values: "0+0x10"}
      - {series: "up{job=\"port49-broker\",instance=\"b\"}", values: "1+0x10"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_target_down
        exp_alerts:
          - exp_labels: {job: "port49d", instance: "a", severity: "page"}
            exp_annotations:
              summary: "A port49d or broker target is not answering its scrape: up is 0 for it."
  # port49_target_absent: port49d only, a page
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49-broker\",instance=\"b\"}", values: "1+0x20"}
    alert_rule_test:
      - eval_time: 3m
        alertname: port49_target_absent
        exp_alerts: []
      - eval_time: 6m
        alertname: port49_target_absent
        exp_alerts:
          - exp_labels: {job: "port49d", severity: "page"}
            exp_annotations:
              summary: "Prometheus has no up series for port49d: no port49d target exists at all, so every device has lost port49 and falls to local authentication, and no other port49d rule can fire."
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49d\",instance=\"a\"}", values: "1+0x20"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_target_absent
        exp_alerts: []
  # port49_broker_target_absent: the broker only, a ticket
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49d\",instance=\"a\"}", values: "1+0x20"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_broker_target_absent
        exp_alerts: []
      - eval_time: 15m
        alertname: port49_broker_target_absent
        exp_alerts:
          - exp_labels: {job: "port49-broker", severity: "ticket"}
            exp_annotations:
              summary: "Prometheus has no up series for the broker: no broker target exists at all, so no token can be minted and no other broker rule can fire."
  - interval: 1m
    input_series:
      - {series: "up{job=\"port49-broker\",instance=\"b\"}", values: "1+0x20"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_broker_target_absent
        exp_alerts: []
  # port49_global_cap_shedding
  - interval: 1m
    input_series:
      - {series: "port49_connections_shed_total{instance=\"a\",reason=\"global_cap\"}", values: "0+1x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_global_cap_shedding
        exp_alerts:
          - exp_labels: {instance: "a", reason: "global_cap", severity: "page"}
            exp_annotations:
              summary: "port49d reset TACACS+ connections at accept because the global connection cap was full; devices fall to local authentication."
  - interval: 1m
    input_series:
      - {series: "port49_connections_shed_total{instance=\"a\",reason=\"global_cap\"}", values: "5+0x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_global_cap_shedding
        exp_alerts: []
  # port49_connections_near_cap
  - interval: 1m
    input_series:
      - {series: "port49_connections{instance=\"a\",state=\"open\"}", values: "90+0x40"}
      - {series: "port49_connections_max{instance=\"a\"}", values: "100+0x40"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_connections_near_cap
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "A port49d is holding more than 80% of limits.max_connections open; raise the cap or add replicas before it sheds."
  - interval: 1m
    input_series:
      - {series: "port49_connections{instance=\"a\",state=\"open\"}", values: "50+0x40"}
      - {series: "port49_connections_max{instance=\"a\"}", values: "100+0x40"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_connections_near_cap
        exp_alerts: []
  # port49_key_secret_files_changed
  - interval: 1m
    input_series:
      - {series: "port49_key_secret_files_changed{instance=\"a\"}", values: "1+0x40"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_key_secret_files_changed
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "A key version's secret file changed or cannot be read; the held secret stays in force until the next start."
  - interval: 1m
    input_series:
      - {series: "port49_key_secret_files_changed{instance=\"a\"}", values: "0+0x40"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_key_secret_files_changed
        exp_alerts: []
  # port49_issuing_ca_missing
  - interval: 1m
    input_series:
      - {series: "port49_issuing_ca_not_after_timestamp_seconds{instance=\"a\"}", values: "0+0x40"}
      - {series: "port49_issuing_ca_configured{instance=\"a\"}", values: "1+0x40"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_issuing_ca_missing
        exp_alerts:
          - exp_labels: {instance: "a", severity: "page"}
            exp_annotations:
              summary: "A broker is configured to issue certificates and has no usable issuing CA, so every OIDC sign-in is refused issuance_unavailable; run port49d init-issuer or restore the CA."
  - interval: 1m
    input_series:
      - {series: "port49_issuing_ca_not_after_timestamp_seconds{instance=\"a\"}", values: "0+0x40"}
      - {series: "port49_issuing_ca_configured{instance=\"a\"}", values: "0+0x40"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_issuing_ca_missing
        exp_alerts: []
  # port49_issuing_ca_expiring
  - interval: 1m
    input_series:
      - {series: "port49_issuing_ca_not_after_timestamp_seconds{instance=\"a\"}", values: "3456000+0x40"}
      - {series: "port49_issuing_ca_configured{instance=\"a\"}", values: "1+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_issuing_ca_expiring
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "The issuing CA expires within 90 days; make its successor and distribute the new bundle before sign-ins stop."
  - interval: 1m
    input_series:
      - {series: "port49_issuing_ca_not_after_timestamp_seconds{instance=\"a\"}", values: "17280000+0x40"}
      - {series: "port49_issuing_ca_configured{instance=\"a\"}", values: "1+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_issuing_ca_expiring
        exp_alerts: []
  # port49_key_retirement_within_7d
  - interval: 1m
    input_series:
      - {series: "port49_key_version_devices{key_ref=\"k\",version=\"1\"}", values: "3+0x40"}
      - {series: "port49_key_retirement_seconds{key_ref=\"k\",version=\"1\"}", values: "259200+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_key_retirement_within_7d
        exp_alerts:
          - exp_labels: {key_ref: "k", version: "1", severity: "ticket"}
            exp_annotations:
              summary: "A key version with devices still on it passes its retire_after within 7 days; move the devices (the decision log names them) before it does."
  - interval: 1m
    input_series:
      - {series: "port49_key_version_devices{key_ref=\"k\",version=\"1\"}", values: "0+0x40"}
      - {series: "port49_key_retirement_seconds{key_ref=\"k\",version=\"1\"}", values: "259200+0x40"}
      - {series: "port49_key_version_devices{key_ref=\"k\",version=\"2\"}", values: "3+0x40"}
      - {series: "port49_key_retirement_seconds{key_ref=\"k\",version=\"2\"}", values: "2592000+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_key_retirement_within_7d
        exp_alerts: []
  # port49_key_retirement_within_1d
  - interval: 1m
    input_series:
      - {series: "port49_key_version_devices{key_ref=\"k\",version=\"1\"}", values: "3+0x40"}
      - {series: "port49_key_retirement_seconds{key_ref=\"k\",version=\"1\"}", values: "3600+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_key_retirement_within_1d
        exp_alerts:
          - exp_labels: {key_ref: "k", version: "1", severity: "page"}
            exp_annotations:
              summary: "A key version with devices still on it passes its retire_after within a day, or already has; those devices fail authentication once it does."
  - interval: 1m
    input_series:
      - {series: "port49_key_version_devices{key_ref=\"k\",version=\"1\"}", values: "3+0x40"}
      - {series: "port49_key_retirement_seconds{key_ref=\"k\",version=\"1\"}", values: "259200+0x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_key_retirement_within_1d
        exp_alerts: []
  # port49_admin_touch_refused
  - interval: 1m
    input_series:
      - {series: "port49_admin_touch_total{instance=\"a\",outcome=\"refused\"}", values: "0+1x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_admin_touch_refused
        exp_alerts:
          - exp_labels: {instance: "a", outcome: "refused", severity: "page"}
            exp_annotations:
              summary: "An admin call was refused its hardware-key touch proof: a stolen token or a broken key."
  - interval: 1m
    input_series:
      - {series: "port49_admin_touch_total{instance=\"a\",outcome=\"refused\"}", values: "3+0x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_admin_touch_refused
        exp_alerts: []
  # port49_policy_fail_closed_compositions
  - interval: 1m
    input_series:
      - {series: "port49_policy_fail_closed_compositions{instance=\"a\"}", values: "2+0x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_policy_fail_closed_compositions
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "The policy in force has compositions answered fail-closed: those users are denied all but the allows; port49 policy test names them."
  - interval: 1m
    input_series:
      - {series: "port49_policy_fail_closed_compositions{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_policy_fail_closed_compositions
        exp_alerts: []
  # port49_policy_file_refused
  - interval: 1m
    input_series:
      - {series: "port49_policy_file_refused{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_policy_file_refused
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "The policy file on disk was refused or will not settle; an older policy is serving."
  - interval: 1m
    input_series:
      - {series: "port49_policy_file_refused{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_policy_file_refused
        exp_alerts: []
  # port49_policy_refresh_pending
  - interval: 1m
    input_series:
      - {series: "port49_policy_refresh_pending{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 7m
        alertname: port49_policy_refresh_pending
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "A policy change has not yet reached every live login context."
  - interval: 1m
    input_series:
      - {series: "port49_policy_refresh_pending{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 7m
        alertname: port49_policy_refresh_pending
        exp_alerts: []
  # port49_policy_bundle_mismatch
  - interval: 1m
    input_series:
      - {series: "port49_policy_bundle_matches_runner{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_policy_bundle_mismatch
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "A broker or port49d serves a policy bundle other than the runner's; its tokens or admissions carry another policy until it reloads."
  - interval: 1m
    input_series:
      - {series: "port49_policy_bundle_matches_runner{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_policy_bundle_mismatch
        exp_alerts: []
  # port49_broker_mint_gate_closed
  - interval: 1m
    input_series:
      - {series: "port49_broker_mint_gate_closed{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_broker_mint_gate_closed
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "A broker mints nothing: its mint gate has been closed for over a minute; the store does not answer, or no runner judges its bundle."
  - interval: 1m
    input_series:
      - {series: "port49_broker_mint_gate_closed{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_broker_mint_gate_closed
        exp_alerts: []
  # port49_redemption_restore_unjudged
  - interval: 1m
    input_series:
      - {series: "port49_redemption_restore_unjudged{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 1m
        alertname: port49_redemption_restore_unjudged
        exp_alerts: []
      - eval_time: 3m
        alertname: port49_redemption_restore_unjudged
        exp_alerts:
          - exp_labels: {instance: "a", severity: "page"}
            exp_annotations:
              summary: "port49d cannot read meta/witness, so it cannot tell whether its store was restored, and refuses every token login (store_unavailable) until it can; check the store and the daemon role's read of meta/witness; stopping port49d lets devices fall to break-glass"
  - interval: 1m
    input_series:
      - {series: "port49_redemption_restore_unjudged{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_redemption_restore_unjudged
        exp_alerts: []
  # port49_store_restore_detected
  - interval: 1m
    input_series:
      - {series: "port49_store_restore_detected_timestamp_seconds{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_store_restore_detected
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "port49d found its session store restored from a snapshot: tokens minted before the restore are refused token_spent once (users mint again); revocations and marks made after the snapshot are lost: follow design §13's restore runbook"
  - interval: 1m
    input_series:
      - {series: "port49_store_restore_detected_timestamp_seconds{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_store_restore_detected
        exp_alerts: []
  - interval: 1h
    input_series:
      - {series: "port49_store_restore_detected_timestamp_seconds{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 25h
        alertname: port49_store_restore_detected
        exp_alerts: []
  # the guard's alerts are gone
  - interval: 1m
    input_series:
      - {series: "port49_redemption_restore_guarded{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 20m
        alertname: port49_redemption_restore_guarded
        exp_alerts: []
  # port49_store_directory_unreachable
  - interval: 1m
    input_series:
      - {series: "port49_store_directory_reachable{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_directory_unreachable
        exp_alerts:
          - exp_labels: {instance: "a", severity: "page"}
            exp_annotations:
              summary: "This process cannot read the directory store: revocations and password sign-ins from other regions do not arrive."
  - interval: 1m
    input_series:
      - {series: "port49_store_directory_reachable{instance=\"a\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_directory_unreachable
        exp_alerts: []
  - interval: 1m
    input_series:
      - {series: "port49_connections_max{instance=\"a\"}", values: "100+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_directory_unreachable
        exp_alerts: []
  # port49_store_directory_stale
  - interval: 1m
    input_series:
      - {series: "port49_store_directory_confirmed_timestamp_seconds{instance=\"a\"}", values: "100+0x30"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_store_directory_stale
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "This process last confirmed its copy of the directory store over a minute ago, whatever the reason; its revocation marks may be stale."
  - interval: 1m
    input_series:
      - {series: "port49_store_directory_confirmed_timestamp_seconds{instance=\"a\"}", values: "0+60x30"}
    alert_rule_test:
      - eval_time: 15m
        alertname: port49_store_directory_stale
        exp_alerts: []
  # port49_store_logouts_pending
  - interval: 1m
    input_series:
      - {series: "port49_store_logouts_pending{instance=\"a\"}", values: "2+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_store_logouts_pending
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "Back-channel logouts were accepted while the directory store did not answer and have not reached it."
  - interval: 1m
    input_series:
      - {series: "port49_store_logouts_pending{instance=\"a\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 10m
        alertname: port49_store_logouts_pending
        exp_alerts: []
  # port49_store_marks_feed_down
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"marks\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_marks_feed_down
        exp_alerts:
          - exp_labels: {instance: "a", feed: "marks", severity: "page"}
            exp_annotations:
              summary: "The marks feed is down: revocation marks written elsewhere do not reach this process."
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"marks\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_marks_feed_down
        exp_alerts: []
  # port49_store_feed_legs_colocated
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_legs_colocated{instance=\"a\",feed=\"marks\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 12m
        alertname: port49_store_feed_legs_colocated
        exp_alerts:
          - exp_labels: {instance: "a", feed: "marks", severity: "ticket"}
            exp_annotations:
              summary: "Both legs of the marks feed's watch are on one etcd member: port49 reaches only one etcd member for this feed, so check the other members; that member going dark stalls the feed."
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_legs_colocated{instance=\"a\",feed=\"marks\"}", values: "1+0x5 0+0x25"}
    alert_rule_test:
      - eval_time: 12m
        alertname: port49_store_feed_legs_colocated
        exp_alerts: []
  # port49_store_feed_down
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"contexts\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_feed_down
        exp_alerts:
          - exp_labels: {instance: "a", feed: "contexts", severity: "ticket"}
            exp_annotations:
              summary: "A store feed other than marks is down (contexts, or a split broker's pins or logouts): this process misses other replicas' writes, and its directory copy is not confirmed."
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"pins\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_feed_down
        exp_alerts:
          - exp_labels: {instance: "a", feed: "pins", severity: "ticket"}
            exp_annotations:
              summary: "A store feed other than marks is down (contexts, or a split broker's pins or logouts): this process misses other replicas' writes, and its directory copy is not confirmed."
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"logouts\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_feed_down
        exp_alerts:
          - exp_labels: {instance: "a", feed: "logouts", severity: "ticket"}
            exp_annotations:
              summary: "A store feed other than marks is down (contexts, or a split broker's pins or logouts): this process misses other replicas' writes, and its directory copy is not confirmed."
  - interval: 1m
    input_series:
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"contexts\"}", values: "1+0x30"}
      - {series: "port49_store_feed_up{instance=\"a\",feed=\"marks\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_feed_down
        exp_alerts: []
  # port49_store_circuit_open
  - interval: 1m
    input_series:
      - {series: "port49_store_circuit_open{instance=\"a\",component=\"daemon\",pool=\"context\"}", values: "1+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_circuit_open
        exp_alerts:
          - exp_labels: {instance: "a", component: "daemon", pool: "context", severity: "ticket"}
            exp_annotations:
              summary: "A store pool's circuit is open: its calls fail at once until a probe succeeds."
  - interval: 1m
    input_series:
      - {series: "port49_store_circuit_open{instance=\"a\",component=\"daemon\",pool=\"context\"}", values: "0+0x30"}
    alert_rule_test:
      - eval_time: 6m
        alertname: port49_store_circuit_open
        exp_alerts: []
  # port49_contexts_reindexed
  - interval: 1m
    input_series:
      - {series: "port49_contexts_reindexed_total{instance=\"a\"}", values: "0+1x30"}
