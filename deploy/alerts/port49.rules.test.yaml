        exp_alerts: []
  # port49_accounting_spool_disk_slow
  - interval: 1m
    input_series:
      - {series: "port49_accounting_spool_sync_seconds_bucket{instance=\"a\",le=\"0.005\"}", values: "0+0x40"}
      - {series: "port49_accounting_spool_sync_seconds_bucket{instance=\"a\",le=\"0.025\"}", values: "0+10x40"}
      - {series: "port49_accounting_spool_sync_seconds_bucket{instance=\"a\",le=\"+Inf\"}", values: "0+10x40"}
    alert_rule_test:
      - eval_time: 5m
        alertname: port49_accounting_spool_disk_slow
        exp_alerts: []
      - eval_time: 20m
        alertname: port49_accounting_spool_disk_slow
        exp_alerts:
          - exp_labels: {instance: "a", severity: "ticket"}
            exp_annotations:
              summary: "port49d's accounting spool disk cannot keep up; every accounting record waits on its fsync, so devices see slow or failed accounting. Move the spool directory to a disk with sustained fsync p99 under 10 ms."
  - interval: 1m
    input_series:
      - {series: "port49_accounting_spool_sync_seconds_bucket{instance=\"a\",le=\"0.005\"}", values: "0+10x40"}
      - {series: "port49_accounting_spool_sync_seconds_bucket{instance=\"a\",le=\"+Inf\"}", values: "0+10x40"}
    alert_rule_test:
      - eval_time: 20m
        alertname: port49_accounting_spool_disk_slow
        exp_alerts: []
  # etcd_leader_changes
  - interval: 1m
    input_series:
      - {series: "etcd_server_leader_changes_seen_total{instance=\"e1\"}", values: "0+1x80"}
    alert_rule_test:
      - eval_time: 70m
        alertname: etcd_leader_changes
        exp_alerts:
          - exp_labels: {instance: "e1", severity: "ticket"}
            exp_annotations:
              summary: "etcd changed leader more than 3 times in an hour: a flapping network or a slow disk."
  - interval: 1m
    input_series:
      - {series: "etcd_server_leader_changes_seen_total{instance=\"e1\"}", values: "2+0x80"}
    alert_rule_test:
      - eval_time: 70m
        alertname: etcd_leader_changes
        exp_alerts: []
