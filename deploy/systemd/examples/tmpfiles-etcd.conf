# Install as /usr/lib/tmpfiles.d/port49-etcd.conf on each etcd host, beside sysusers-etcd.conf.
# etcd's data directory (the user is sysusers-etcd.conf's) and the snapshot unit's directory.
# The snapshot unit writes here; tmpfiles.d/port49.conf is not installed on an etcd host.
d /var/backups/port49 0700 root root -
d /var/lib/etcd 0700 etcd etcd -
