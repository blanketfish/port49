! port49 reference AAA configuration: Cisco IOS XE, TACACS+ over TCP (RFC 8907).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is and what was measured on the platform.
!
! Create the break-glass account by hand first, with a secret only you know:
!   username <BREAKGLASS_USER> privilege 15 secret ...
! Level 15 matters: with port49 unreachable, command authorization against local
! passes a command only if the user's level is at or above the command's (L4).
aaa new-model
!
! The IOS XE 17.x object form. The old global tacacs-server host line is deprecated.
tacacs server port49-1
 address ipv4 <PORT49_1>
 key 0 <KEY>
 timeout 5
tacacs server port49-2
 address ipv4 <PORT49_2>
 key 0 <KEY>
 timeout 5
!
! The group pins the VRF and the source interface. Without them IOS XE sources
! TACACS+ from the global table and sends nothing at all (lab note, L1).
aaa group server tacacs+ port49
 server name port49-1
 server name port49-2
 ip vrf forwarding <MGMT_VRF>
 ip tacacs source-interface <SOURCE_INTERFACE>
!
! Every list ends in local (or enable) and never in none or if-authenticated: on an
! ERROR, if-authenticated permits every command (L4-error). A port49 deny (FAIL) is
! final on IOS XE (L4).
aaa authentication login default group port49 local
aaa authentication enable default group port49 enable
aaa authorization exec default group port49 local
aaa authorization commands 1 default group port49 local
aaa authorization commands 7 default group port49 local
aaa authorization commands 15 default group port49 local
aaa authorization config-commands
!
! Level 7 is port49's operator rung (plan 5, decision 25); without this line a level-7
! command runs without asking port49.
privilege exec level 7 clear counters
!
aaa accounting exec default start-stop group port49
aaa accounting commands 1 default start-stop group port49
aaa accounting commands 7 default start-stop group port49
aaa accounting commands 15 default start-stop group port49
!
! The console takes the local method alone. Without this list a stopped port49d locks
! out SSH and the console together, and IOS XE has no console default of its own.
aaa authentication login CONSOLE local
line con 0
 login authentication CONSOLE
