! port49 reference AAA configuration: Arista EOS, TACACS+ over TLS (RFC 9887).
! EOS 4.36.1F or later. Measured on cEOS 4.36.3M (L73).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is.
!
! Create the break-glass account by hand first (see arista_eos.cfg).
!
! The device certificate: make the key and the signing request on the device
! (security pki key generate rsa 2048 <CERT_ID>.key, then security pki certificate
! generate signing-request key <CERT_ID>.key parameters common-name <SERVER_NAME>),
! have your CA sign it, and copy the signed certificate, the intermediate and the
! root into certificate: under the names below. A TLS host carries no shared key.
!
! EOS sends its leaf alone, so port49d needs the intermediate: set
! tls_listener intermediates_file in port49d.yaml (README.md, "EOS").
management security
   ssl profile port49-tacacs
      certificate <CERT_ID>.crt key <CERT_ID>.key
      chain certificate port49-intermediate.crt
      trust certificate port49-root.crt
!
ip tacacs vrf <MGMT_VRF> source-interface <SOURCE_INTERFACE>
!
tacacs-server tls ssl-profile port49-tacacs
tacacs-server host <PORT49_1> vrf <MGMT_VRF> tls single-connection port <TLS_PORT>
tacacs-server host <PORT49_2> vrf <MGMT_VRF> tls single-connection port <TLS_PORT>
!
aaa group server tacacs+ port49
   server <PORT49_1> vrf <MGMT_VRF>
   server <PORT49_2> vrf <MGMT_VRF>
!
aaa authentication login default group port49 local
aaa authentication enable default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands all default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands all default start-stop group port49
