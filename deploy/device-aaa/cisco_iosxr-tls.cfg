! port49 reference AAA configuration: Cisco IOS XR, TACACS+ over TLS (RFC 9887).
! Measured on XRd 26.1.1 (L73 addendum).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is.
!
! Create the break-glass account by hand first (see cisco_iosxr.cfg), and add the
! policy platforms block in policy-platforms.yaml.
!
! The device certificate. XR enrols nothing until a domain name is configured (set one
! under your own domain: domain name followed by it). The trustpoint key is RSA.
! Enrolment is interactive and is not repeated here: do crypto key generate rsa
! <CERT_ID>, crypto ca authenticate for the root and the intermediate, crypto ca enroll
! <CERT_ID>, have your CA sign the request and crypto ca import <CERT_ID> certificate.
! The root sits on its own trustpoint, as in the L73 run; the intermediate goes on <CERT_ID>
! (crypto ca authenticate port49-root, then crypto ca authenticate <CERT_ID>).
crypto ca trustpoint port49-root
 enrollment terminal
!
crypto ca trustpoint <CERT_ID>
 enrollment terminal
 rsakeypair <CERT_ID>
 subject-name CN=<SERVER_NAME>
 serial-number none
 ip-address none
!
! The source pin and the group vrf are unmeasured (L88): the lab ran neither.
tacacs source-interface <SOURCE_INTERFACE> vrf <MGMT_VRF>
!
! XR dials 49, not 300, with no port set, so the port is always set. Each option past
! the port ends its line, so each is a line of its own for the same host.
tacacs-server host <PORT49_1> port <TLS_PORT> tls trustpoint <CERT_ID>
tacacs-server host <PORT49_1> port <TLS_PORT> single-connection
tacacs-server host <PORT49_2> port <TLS_PORT> tls trustpoint <CERT_ID>
tacacs-server host <PORT49_2> port <TLS_PORT> single-connection
!
aaa group server tacacs+ port49
 server <PORT49_1>
 server <PORT49_2>
 vrf <MGMT_VRF>
!
aaa authentication login default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands default start-stop group port49
