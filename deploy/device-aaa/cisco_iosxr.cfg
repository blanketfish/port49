! port49 reference AAA configuration: Cisco IOS XR, TACACS+ over TCP (RFC 8907).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is and what was measured on the platform.
!
! Create the break-glass account by hand first, with a secret only you know:
!   username <BREAKGLASS_USER> group root-lr, group cisco-support, secret ...
!
! XR needs a policy platforms block until platform_set carries a cisco_iosxr adapter:
! see policy-platforms.yaml in this directory.
tacacs source-interface <SOURCE_INTERFACE> vrf <MGMT_VRF>
!
tacacs-server host <PORT49_1> key 0 <KEY>
tacacs-server host <PORT49_2> key 0 <KEY>
!
aaa group server tacacs+ port49
 server <PORT49_1>
 server <PORT49_2>
 vrf <MGMT_VRF>
!
! Command authorization must be configured: without it port49 never sees a command and
! priv-lvl is the only bound. Every list ends in local.
aaa authentication login default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands default start-stop group port49
