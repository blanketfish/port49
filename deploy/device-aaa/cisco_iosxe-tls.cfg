! port49 reference AAA configuration: Cisco IOS XE, TACACS+ over TLS (RFC 9887).
! IOS XE 17.18.1 or later. Measured on C8000V 17.18.02 (L73).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is.
!
! Create the break-glass account by hand first (see cisco_iosxe.cfg).
!
! The device certificate. Terminal enrolment is interactive and is not repeated here:
! make an EC key (crypto key generate ec keysize 256 label <CERT_ID>), authenticate the
! root and the intermediate (crypto pki authenticate), run crypto pki enroll <CERT_ID>,
! have your CA sign the request and crypto pki import <CERT_ID> certificate.
! Set revocation-check to match what your CA publishes.
aaa new-model
!
crypto pki trustpoint <CERT_ID>
 enrollment terminal pem
 subject-name CN=<SERVER_NAME>
 serial-number none
 ip-address none
 eckeypair <CERT_ID>
! The root that signs port49d's certificate. L73 ran tls trustpoint server on 17.18.02;
! authenticate this trustpoint with your root (crypto pki authenticate port49-root).
crypto pki trustpoint port49-root
 enrollment terminal
!
! Two server objects at two DISTINCT addresses. IOS XE 17.18.02 drops the address of a
! second object that would share one (L73). With no port set IOS XE dials 6049, so
! the port is always set.
tacacs server port49-1
 address ipv4 <PORT49_1>
 tls port <TLS_PORT>
 tls trustpoint client <CERT_ID>
 tls trustpoint server port49-root
 tls ip vrf forwarding <MGMT_VRF>
 tls ip tacacs source-interface <SOURCE_INTERFACE>
 single-connection
 timeout 5
tacacs server port49-2
 address ipv4 <PORT49_2>
 tls port <TLS_PORT>
 tls trustpoint client <CERT_ID>
 tls trustpoint server port49-root
 tls ip vrf forwarding <MGMT_VRF>
 tls ip tacacs source-interface <SOURCE_INTERFACE>
 single-connection
 timeout 5
!
aaa group server tacacs+ port49
 server name port49-1
 server name port49-2
 ip vrf forwarding <MGMT_VRF>
 ip tacacs source-interface <SOURCE_INTERFACE>
!
aaa authentication login default group port49 local
aaa authentication enable default group port49 enable
aaa authorization exec default group port49 local
aaa authorization commands 1 default group port49 local
aaa authorization commands 7 default group port49 local
aaa authorization commands 15 default group port49 local
aaa authorization config-commands
privilege exec level 7 clear counters
!
aaa accounting exec default start-stop group port49
aaa accounting commands 1 default start-stop group port49
aaa accounting commands 7 default start-stop group port49
aaa accounting commands 15 default start-stop group port49
!
aaa authentication login CONSOLE local
line con 0
 login authentication CONSOLE
