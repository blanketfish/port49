! port49 reference AAA configuration: Cisco NX-OS, TACACS+ over TLS (RFC 9887).
! NX-OS 10.6(1)F or later. Measured on N9Kv 10.6(2)F (L73).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is.
!
! Create the break-glass account by hand first (see cisco_nxos.cfg).
!
! The device certificate. Enrolment is interactive and is not repeated here. The key is
! RSA, which is what the L73 enrolment issued on this image:
!   crypto key generate rsa label <CERT_ID> exportable modulus 2048
! then authenticate the root and the intermediate (crypto ca authenticate), run
! crypto ca enroll <CERT_ID> (name <SERVER_NAME> as the alternate subject name), have
! your CA sign the request and crypto ca import <CERT_ID> certificate.
feature tacacs+
!
crypto ca trustpoint <CERT_ID>
  rsakeypair <CERT_ID>
!
! No key on a TLS host. With no port set NX-OS dials 49, so the port is always set.
tacacs-server host <PORT49_1> port <TLS_PORT> single-connection
tacacs-server host <PORT49_1> tls client-trustpoint <CERT_ID>
tacacs-server host <PORT49_2> port <TLS_PORT> single-connection
tacacs-server host <PORT49_2> tls client-trustpoint <CERT_ID>
!
! No deadtime line (L4).
aaa group server tacacs+ port49
  server <PORT49_1>
  server <PORT49_2>
  use-vrf <MGMT_VRF>
  source-interface <SOURCE_INTERFACE>
!
aaa authentication login default group port49 local
aaa authorization commands default group port49 local
aaa authorization config-commands default group port49 local
aaa accounting default group port49
