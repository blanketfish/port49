! port49 reference AAA configuration: Arista EOS, TACACS+ over TCP (RFC 8907).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is and what was measured on the platform.
!
! Create the break-glass account by hand first, with a password only you know:
!   username <BREAKGLASS_USER> privilege 15 role network-admin secret ...
! `role network-admin` is not decoration: when port49 is unreachable, EOS command
! authorization falls back to the local ROLE, and a privilege-15 account without
! one cannot configure anything (L4).
!
! One server group, two port49 servers, source pinned (spec section 10: the source
! address MUST be pinned, so port49 sees one address per device whichever path the
! packet takes).
! L88 loaded the vrf and source-interface clauses as shipped (default VRF) on vEOS and cEOS.
ip tacacs vrf <MGMT_VRF> source-interface <SOURCE_INTERFACE>
!
tacacs-server host <PORT49_1> vrf <MGMT_VRF> key 0 <KEY>
tacacs-server host <PORT49_2> vrf <MGMT_VRF> key 0 <KEY>
!
aaa group server tacacs+ port49
   server <PORT49_1> vrf <MGMT_VRF>
   server <PORT49_2> vrf <MGMT_VRF>
!
! Every list ends in local and never in none. A port49 deny (FAIL) is final on EOS (L4).
aaa authentication login default group port49 local
aaa authentication enable default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands all default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands all default start-stop group port49
