! port49 reference AAA configuration: Cisco NX-OS, TACACS+ over TCP (RFC 8907).
!
! Replace each angle-bracket placeholder before you paste this. README.md in this
! directory says what each one is and what was measured on the platform.
!
! Create the break-glass account by hand first, with a password only you know:
!   username <BREAKGLASS_USER> role network-admin password ...
! NX-OS falls back to a local ROLE for command authorization, not a privilege level (L4).
feature tacacs+
!
tacacs-server host <PORT49_1> key 0 <KEY>
tacacs-server host <PORT49_2> key 0 <KEY>
!
! No deadtime line, ever: on NX-OS, deadtime 1 locks token logins out for its minute
! after the server returns (L4).
aaa group server tacacs+ port49
  server <PORT49_1>
  server <PORT49_2>
  use-vrf <MGMT_VRF>
  source-interface <SOURCE_INTERFACE>
!
! Every list ends in local. NX-OS keeps a separate console login list that defaults to
! local, so the console needs no line here.
aaa authentication login default group port49 local
aaa authorization commands default group port49 local
aaa authorization config-commands default group port49 local
aaa accounting default group port49
