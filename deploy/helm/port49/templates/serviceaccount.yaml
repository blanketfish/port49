{{- range $c := list "port49d" "broker" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $c }}
  labels:
    {{- include "port49.labels" (dict "root" $ "component" $c) | nindent 4 }}
# Neither process calls the Kubernetes API: no token is mounted.
automountServiceAccountToken: false
---
{{- end }}
