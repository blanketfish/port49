{{- if .Values.autoscaling.enabled }}
# Scale on connections, never CPU (design §13). A Pods metric needs a custom-metrics adapter
# serving port49_connections; this is rendered and tested, never exercised here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-port49d
  labels:
    {{- include "port49.labels" (dict "root" . "component" "port49d") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ .Release.Name }}-port49d
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric: {name: port49_connections}
        target: {type: AverageValue, averageValue: {{ .Values.autoscaling.averageConnections | quote }}}
{{- end }}
