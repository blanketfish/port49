# The Velero resource modifier for the restore in README.md, step 3: every StatefulSet in `port49` is
# restored at 0 replicas, so no broker or port49d starts before the token delete and the re-issued
# revocations. Create the ConfigMap from this file in the `velero` namespace (Velero 1.12 or later).
version: v1
resourceModifierRules:
  - conditions:
      groupResource: statefulsets.apps
      namespaces:
        - port49
    patches:
      - operation: replace
        path: "/spec/replicas"
        value: "0"
