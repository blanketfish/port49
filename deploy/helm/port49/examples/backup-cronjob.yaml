# The etcd snapshot (design §13's runbook), as a CronJob. Every name is fake: the PVC
# `port49-backups` and the Secret `port49-etcd-root` (etcd's root certificate and key, ca.crt
# tls.crt tls.key) are yours.
#
# The etcd image has no shell, so the command is etcdctl itself and each run replaces
# /backups/etcd-snapshot.db: keep history with your PVC's snapshots. etcdctl creates the file
# 0600 (unmeasured here: `umask 077` is not available without a shell). The root Secret is
# mounted only in this Job's pod.
#
# The sealed enrollments (`port49-broker export-enrollments`) are not a CronJob: the port49 image
# has no shell to redirect its binary stdout into a 0600 file. The README runs it from a
# workstation with `umask 077`.
#
# Velero for port49's own PVCs is unmeasured and not named here (plan 12c).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: port49-etcd-snapshot
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
          containers:
            - name: snapshot
              image: gcr.io/etcd-development/etcd:v3.6.15@sha256:5ed4e32061aa061f970d6500629213e8579ef17571dcf9789074966acb9afad1
              command:
                - /usr/local/bin/etcdctl
                - --endpoints=https://etcd-0.etcd.port49-etcd.svc:2379
                - --cacert=/etcd-root/ca.crt
                - --cert=/etcd-root/tls.crt
                - --key=/etcd-root/tls.key
                - snapshot
                - save
                - /backups/etcd-snapshot.db
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: etcd-root, mountPath: /etcd-root, readOnly: true}
                - {name: backups, mountPath: /backups}
          volumes:
            - name: etcd-root
              secret: {secretName: port49-etcd-root, defaultMode: 0440}
            - name: backups
              persistentVolumeClaim: {claimName: port49-backups}
