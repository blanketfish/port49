# The sealed enrollment store (`port49-broker export-enrollments --out`), as a CronJob, by the same
# pattern as backup-cronjob.yaml: a stale-check that fails loudly, an export into `<name>.new`, then a
# finish step that does `umask 077`, renames to a dated name and prunes after 14 days. Every name is
# fake; the volumes mirror what the broker StatefulSet mounts (the chart's templates/
# broker-statefulset.yaml), minus its data PVC, and `port49-backups` is your PVC. Keep it in
# the broker's namespace, and use the release name in place of `port49-broker` and the
# ConfigMap name. Add the attestation-roots and directory mounts if the broker's config names them.
#
# --out creates the file with O_EXCL and mode 0600, syncs it, and removes it if the export fails
# (spec §12), so the export never touches a log and never replaces a file. The export still needs
# the config to load, so broker.state_dir must exist: an emptyDir made 0700 by the root init
# container, the same init the chart's StatefulSet uses.
# Restore with `port49 directory import`, which needs an admin and a key press.
#
# UNVERIFIED until Task 11's kind smoke: nothing in this file has run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: port49-enrollments-export
spec:
  schedule: "23 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
          initContainers:
            - name: state-dir
              image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
              command: [sh, -c, "install -d -m 0700 -o 65532 -g 65532 /var/lib/port49-broker/state && chmod 0755 /var/lib/port49-broker"]
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL], add: [CHOWN, FOWNER, DAC_OVERRIDE]}
              volumeMounts:
                - {name: state, mountPath: /var/lib/port49-broker}
            - name: stale-check
              image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
              command:
                - sh
                - -c
                - |
                  set -eu
                  [ ! -e /backup/enrollments.new ] || { echo "/backup/enrollments.new is left from a run that did not finish: check it, remove it, and the next run proceeds" >&2; exit 1; }
              securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: backups, mountPath: /backup, readOnly: true}
            - name: export
              image: ghcr.io/rhwendt/port49:0.1.0
              command: [/usr/local/bin/port49-broker]
              args: [export-enrollments, --config, /etc/port49/config/port49-broker.yaml, --out, /backup/enrollments.new]
              securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: config, mountPath: /etc/port49/config, readOnly: true}
                - {name: encryption, mountPath: /etc/port49/secrets, readOnly: true}
                - {name: etcd-ca, mountPath: /etc/port49/etcd-ca, readOnly: true}
                - {name: etcd-client, mountPath: /etc/port49/etcd, readOnly: true}
                - {name: broker-tls, mountPath: /etc/port49/broker, readOnly: true}
                - {name: state, mountPath: /var/lib/port49-broker}
                - {name: backups, mountPath: /backup}
          containers:
            - name: finish
              image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
              command:
                - sh
                - -c
                - |
                  set -eu; umask 077
                  new=/backup/enrollments.new
                  dated=/backup/enrollments-$(date -u +%Y%m%dT%H%M%SZ).json
                  [ ! -e "$dated" ] || { echo "$dated exists: not replaced" >&2; exit 1; }
                  chmod 0600 "$new"
                  mv "$new" "$dated"
                  find /backup -name 'enrollments-*.json' -mtime +14 -delete
              securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: backups, mountPath: /backup}
          volumes:
            - name: config
              configMap: {name: port49-broker}
            - name: encryption
              secret: {secretName: port49-encryption, defaultMode: 0440}
            - name: etcd-ca
              secret: {secretName: port49-etcd-ca, defaultMode: 0440}
            - name: etcd-client
              secret: {secretName: port49-etcd-broker, defaultMode: 0440}
            - name: broker-tls
              secret: {secretName: port49-broker-tls, defaultMode: 0440}
            - name: state
              emptyDir: {}
            - name: backups
              persistentVolumeClaim: {claimName: port49-backups}
