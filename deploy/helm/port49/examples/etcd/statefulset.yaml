# Three etcd members with client-certificate auth, a reference for the chart's smoke (plan 12b,
# Task 11): not a managed etcd. Secret `etcd-tls` holds ca.crt, and a server and peer certificate
# and key per member as etcd-N.crt / etcd-N.key (SANs: etcd-N.etcd.port49-etcd.svc). Every name
# is fake. The etcd image has no shell: a member's name comes from the downward API and the
# other settings expand it with Kubernetes' own $(ETCD_NAME).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: port49-etcd
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: etcd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: etcd}
    spec:
      automountServiceAccountToken: false   # etcd does not call the Kubernetes API
      terminationGracePeriodSeconds: 60
      securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
      containers:
        - name: etcd
          image: gcr.io/etcd-development/etcd:v3.6.15@sha256:5ed4e32061aa061f970d6500629213e8579ef17571dcf9789074966acb9afad1
          command: [/usr/local/bin/etcd]
          env:
            # etcd reads its own configuration from ETCD_* variables: names and addresses, never a secret.
            - {name: ETCD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: ETCD_DATA_DIR, value: /var/lib/etcd}
            - {name: ETCD_LISTEN_CLIENT_URLS, value: "https://0.0.0.0:2379"}
            - {name: ETCD_LISTEN_PEER_URLS, value: "https://0.0.0.0:2380"}
            - {name: ETCD_ADVERTISE_CLIENT_URLS, value: "https://$(ETCD_NAME).etcd.port49-etcd.svc:2379"}
            - {name: ETCD_INITIAL_ADVERTISE_PEER_URLS, value: "https://$(ETCD_NAME).etcd.port49-etcd.svc:2380"}
            - {name: ETCD_INITIAL_CLUSTER, value: "etcd-0=https://etcd-0.etcd.port49-etcd.svc:2380,etcd-1=https://etcd-1.etcd.port49-etcd.svc:2380,etcd-2=https://etcd-2.etcd.port49-etcd.svc:2380"}
            - {name: ETCD_INITIAL_CLUSTER_STATE, value: new}
            - {name: ETCD_INITIAL_CLUSTER_TOKEN, value: port49-etcd}
            - {name: ETCD_CERT_FILE, value: "/etc/etcd-tls/$(ETCD_NAME).crt"}
            - {name: ETCD_KEY_FILE, value: "/etc/etcd-tls/$(ETCD_NAME).key"}
            - {name: ETCD_PEER_CERT_FILE, value: "/etc/etcd-tls/$(ETCD_NAME).crt"}
            - {name: ETCD_PEER_KEY_FILE, value: "/etc/etcd-tls/$(ETCD_NAME).key"}
            - {name: ETCD_TRUSTED_CA_FILE, value: /etc/etcd-tls/ca.crt}
            - {name: ETCD_PEER_TRUSTED_CA_FILE, value: /etc/etcd-tls/ca.crt}
            - {name: ETCD_CLIENT_CERT_AUTH, value: "true"}
            # design §13: periodic compaction, since every login and touch writes a revision
            - {name: ETCD_AUTO_COMPACTION_MODE, value: periodic}
            - {name: ETCD_AUTO_COMPACTION_RETENTION, value: "10m"}
            # and a backend quota: etcd's 2 GiB default fills and refuses every write
            - {name: ETCD_QUOTA_BACKEND_BYTES, value: "8589934592"}
            - {name: ETCD_PEER_CLIENT_CERT_AUTH, value: "true"}
          ports:
            - {name: client, containerPort: 2379}
            - {name: peer, containerPort: 2380}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /etc/etcd-tls, readOnly: true}
            - {name: data, mountPath: /var/lib/etcd}
      volumes:
        - name: tls
          secret: {secretName: etcd-tls, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
