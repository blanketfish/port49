# The cluster-wide option for external-secret.yaml: one store several namespaces may use. Without
# `conditions`, a ClusterSecretStore can be used from every namespace, so anyone who can create an
# ExternalSecret anywhere could read the device keys through this Vault role: the condition below limits
# it to the release's namespace, port49. Every value is fake. Prefer the namespaced SecretStore.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: port49-vault
spec:
  conditions:
    - namespaces: [port49]
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: port49
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: port49-device-keys
  namespace: port49
spec:
  refreshInterval: 1h
  secretStoreRef: {name: port49-vault, kind: ClusterSecretStore}
  target:
    name: port49-device-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: core_v1
      remoteRef: {key: port49/devices/core-v1}
    - secretKey: core_v2
      remoteRef: {key: port49/devices/core-v2}
