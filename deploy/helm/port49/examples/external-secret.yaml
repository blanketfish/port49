# The device keys as one Secret, rendered by External Secrets Operator (ESO) from a Vault KV.
# Every value here is fake: replace the store's server, path and the remote keys.
#
# A new key version is a NEW remote key and a NEW `data` entry (here core_v3 from
# port49/devices/core-v3), never a rewritten one: ESO's refresh rewrites the Secret, and port49d
# reads each version once (spec §10, §12), saying so when a held file's bytes change. Name the
# version in the policy as {version: 3, secret_ref: file:/run/port49/keys/core_v3}; the kubelet
# updates the whole-volume mount in place, so it reaches port49d with no restart.
#
# The target name is the chart's keys.existingSecret (README: --set keys.existingSecret=port49-device-keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: port49-vault
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: port49
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: port49-device-keys
spec:
  refreshInterval: 1h
  secretStoreRef: {name: port49-vault, kind: ClusterSecretStore}
  target:
    name: port49-device-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: core_v1
      remoteRef: {key: port49/devices/core-v1}
    - secretKey: core_v2
      remoteRef: {key: port49/devices/core-v2}
