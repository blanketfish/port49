# The device keys as one Secret, rendered by External Secrets Operator (ESO) from a Vault KV.
# Every value here is fake: replace the store's server, path and the remote keys.
#
# A new key version is a NEW remote key and a NEW `data` entry (here core_v3 from
# port49/devices/core-v3), never a rewritten one: ESO's refresh rewrites the Secret, and port49d
# reads each version once (spec §10, §12), saying so when a held file's bytes change. Name the
# version in the policy as {version: 3, secret_ref: file:/run/port49/keys/core_v3}; the kubelet
# updates the whole-volume mount in place, so it reaches port49d with no restart.
#
# The target name is the chart's keys.existingSecret (README: --set keys.existingSecret=port49-device-keys).
#
# The store is a namespaced SecretStore: applied with `kubectl -n port49` (the release's namespace), it
# can be used only by ExternalSecrets in that namespace. A cluster-wide ClusterSecretStore with no
# `conditions` would let anyone who can create an ExternalSecret in ANY namespace sync the device keys
# through this Vault role into their own: see external-secret-clusterstore.yaml, which names the
# namespace, only if you need one store for several releases.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: port49-vault
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: port49
          serviceAccountRef: {name: port49-vault-auth}   # a ServiceAccount in this namespace, bound to the Vault role
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: port49-device-keys
spec:
  refreshInterval: 1h
  secretStoreRef: {name: port49-vault, kind: SecretStore}
  target:
    name: port49-device-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: core_v1
      remoteRef: {key: port49/devices/core-v1}
    - secretKey: core_v2
      remoteRef: {key: port49/devices/core-v2}
