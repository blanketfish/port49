# port49-broker in the compose stack (plan 7f, Task 1); paths inside the
# container (broker-etc, mounted read-only at /etc/port49).
metrics_listen: ":9050"
inventory_file: /etc/port49/inventory.yaml
key_refs: [k]
encryption:
  current: {id: c1, secret_env: PORT49_ENC_KEY}
admin_socket: /run/port49/port49-broker.sock
broker:
  listen: ":8443"
  tls_cert_file: /etc/port49/broker/broker.pem
  tls_key_file: /etc/port49/broker/broker-key.pem
  client_ca_file: /etc/port49/broker/broker-ca.pem
  policy_file: /etc/port49/policy.yaml
  # the broker-state volume; 0700 and owned by uid 65532 from the image
  state_dir: /var/lib/port49-broker
  # A trial PKI publishes no CRL. A deployment names its CRL (or OCSP) here
  # and leaves on_unavailable at refuse (spec §5.1.4).
  certificate_status: {disabled: true}
  # How often the broker re-verifies every live principal and stamps
  # refreshed_at, 1m to 1h. It runs with or without a directory, and the
  # daemon's session.staleness_ceiling (default 4h) denies a session the
  # stamp has not reached.
  # refresh_interval: 5m
  #
  # The directory (spec §14; design §10) is off here: the trial has none, and
  # a subject names its username. Uncomment and adapt to resolve humans and
  # their groups from LDAP. Put the keytab and krb5.conf in broker-etc, the
  # keytab 0600 and owned by 65532; set PORT49_SITE per broker container.
  # directory:
  #   servers:
  #     - {uri: "ldaps://dc1.corp.example.com:636", site: hq, priority: 100}
  #     - {uri: "ldaps://dc2.corp.example.com:636", site: hq, priority: 90}
  #   site_env: PORT49_SITE       # this broker's site; the default variable
  #   ca_file: /etc/port49/directory/ca.pem
  #   bind:
  #     mechanism: gssapi         # external | gssapi | simple (the weakest)
  #     principal: svc-port49@CORP.EXAMPLE.COM
  #     keytab_file: /etc/port49/directory/svc-port49.keytab
  #     krb5_conf: /etc/port49/directory/krb5.conf
  #   base_dn: dc=corp,dc=example,dc=com
  #   groups_base_dn: ou=groups,dc=corp,dc=example,dc=com
  #   principal_attribute: userPrincipalName
  #   username_attribute: sAMAccountName
  #   certificate_mapping: {kind: issuer_serial}   # strong; no allow_weak needed
  #   nested_groups: in_chain     # in_chain (Active Directory) | recursive | direct
  #   grace: 4h                   # how long a stored membership answers when no server does
  #   prewarm: {interval: 1h, max_principals: 10000}
store:
  backend: etcd
  etcd:
    endpoints: [https://etcd-1:2379, https://etcd-2:2379, https://etcd-3:2379]
    ca_file: /etc/port49/etcd/ca.pem
    broker: {cert_file: /etc/port49/etcd/port49-broker.pem, key_file: /etc/port49/etcd/port49-broker-key.pem}
