subjects:
  - name: svc_backup
    identity:
      - "system:serviceaccount:netops:oxidized"
    username: svc-backup
    token_ttl: 900s
# The device key sets, beside the key groups that assign them (decision 53
# ruling 3). The secret is read from port49d's environment: render it there
# from a Kubernetes Secret.
keys:
  prod_key:
    current: {version: 1, secret_ref: env:PORT49_KEY_PROD}
