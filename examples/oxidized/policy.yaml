# The port49 policy for Oxidized (plan 8): merge into your policy file.
# Measured in lab L49 (policy engine spec §15): the permits are the commands
# Oxidized 0.37.0's eos, ios and nxos models sent port49 during a backup
# (tests/lab/results/L49-oxidized-<platform>.md). Junos under platform set 1.0.0
# asks port49 about no command (README §5a).
#
# The principal is the workload certificate's SPIFFE ID, verbatim; the
# username is declared, since a workload has no directory entry (spec §2).
# all_devices is an ordinary scope since plan 4 (spec §5.5); skip these two
# lines if your policy already declares it.
scopes:
  - {name: all_devices, match: {}}
roles:
  - name: config_backup
    # privilege: admin, as spec §2 gives a backup account so show running-config
    # is reachable; the lowest level each model's backup needs is unmeasured (L49
    # ran at admin).
    # Privilege decides what the device offers, the permits what port49 allows
    # within it (spec §2).
    privilege: admin
    permit:
      - "show running-config **"
      - "show startup-config"
      - "show inventory"
      - "show inventory all"
      - "show version"
      - "show vtp status"
      - "terminal length *"
      - "terminal width *"
subjects:
  - name: svc_oxidized
    identity: ["spiffe://corp.example.com/host/oxidized-01"]
    username: svc-oxidized
    token_ttl: 900s
grants:
  - {subject: svc_oxidized, scope: all_devices, roles: [config_backup], max_privilege: admin}
tests:
  - {subject: svc_oxidized, device: leaf-01, command: "show running-config", expect: permit}
  - {subject: svc_oxidized, device: leaf-01, command: "configure terminal", expect: deny}
  - {subject: svc_oxidized, device: leaf-01, command: "reload", expect: deny}
