        register: L76
  - id: operator_policy_required
    what: 'SR Linux needs a policy block or every login is refused, because platform_set 1.3.0 has no nokia_srlinux adapter and the generic adapter sends no priv-lvl (QUAL note, "without a priv-lvl block"). Add to the policy file: platforms: {nokia_srlinux: {privilege: {readonly: ["priv-lvl=1"], operator: ["priv-lvl=15"], admin: ["priv-lvl=15"]}}}. Set priv-lvl-authorization true on the device: its default false means port49 is never asked (L76 cell i); SR Linux''s YANG says the session then gets full admin (srl_nokia-aaa.yang:254). Port49 command permit and deny rules never apply; the session role is the only bound (L76 cell b)'
    code: tests/qual/qual-policy.yaml
    sources:
      - note: tests/lab/results/QUAL-SR-Linux-26.7.2-519-nokia_srlinux-no-priv-lvl.md
        register: QUAL
      - note: tests/lab/results/L76-nokia_srlinux.md
        register: L76
  - id: no_platform_set_adapter
    what: platform_set 1.3.0 has no nokia_srlinux adapter, so the generic adapter serves it and renders nothing; the device refuses a login with no priv-lvl, so the qual policy gives it a platforms block rendering priv-lvl alone, and the golden's authorization is that block's output
    code: tests/qual/qual-policy.yaml
    sources:
