# The kind smoke's cluster (plan 12b, Task 11): one control plane and two workers in two zones, so
# the chart's zone topology spread has two to choose from. No published ports: the device dials
# a node's container address and the NodePort. The node image is pinned by digest (kind v0.29.0's
# own default for Kubernetes v1.33.1).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
  - role: worker
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
    labels:
      topology.kubernetes.io/zone: a
  - role: worker
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
    labels:
      topology.kubernetes.io/zone: b
