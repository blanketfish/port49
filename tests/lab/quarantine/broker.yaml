# The quarantine run's broker block: tests/lab/slice/broker.yaml with the
# quarantining policy. Appended to a derivation of port49d-lab.yaml by hand.
broker:
  listen: "127.0.0.1:8449"
  tls_cert_file: tests/lab/logs/slice-pki/broker.pem
  tls_key_file: tests/lab/logs/slice-pki/broker-key.pem
  client_ca_file: tests/lab/logs/slice-pki/broker-ca.pem
  policy_file: tests/lab/quarantine/policy.yaml
