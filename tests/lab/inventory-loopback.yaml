# A one-device inventory for smoke-running port49d against loopback. It admits
# only 127.0.0.1, so a packet sourced from anywhere else is refused as an
# unadmitted source. Real lab inventories live beside the containerlab topology.
devices:
  - {name: loopback, platform: generic, addresses: [127.0.0.1]}
key_groups:
  - {match: {cidr: 127.0.0.0/8}, key_ref: lab_key}
