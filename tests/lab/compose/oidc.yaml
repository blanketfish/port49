# Keycloak on the lab's compose stack (plan 7h, Task 16): the realm of
# tests/lab/oidc, its issuer https://keycloak.port49.lab:18443/realms/port49-lab,
# which the broker reaches on the stack's network by the alias and the test
# reaches on the published port. Merged after lab.yaml by startComposeWith.
# Everything under ${PORT49_COMPOSE_LOCAL}/oidc is written by TestOIDCEndToEnd
# before `up`; relative paths here are relative to deploy/compose, the project
# directory. The image is the digest tests/lab/oidc/compose.yaml pins, and a
# unit test holds the two equal.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command:
      - start-dev
      - --import-realm
      - --http-enabled=false
      - --https-port=18443
      - --https-certificate-file=/pki/keycloak.pem
      - --https-certificate-key-file=/pki/keycloak-key.pem
      - --hostname=https://keycloak.port49.lab:18443
      - --truststore-paths=/pki/broker-ca.pem
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    # KC_BOOTSTRAP_ADMIN_PASSWORD, generated per run, never in this file
    env_file:
      - path: ${PORT49_COMPOSE_LOCAL}/oidc/admin.env
    volumes:
      - ../../tests/lab/oidc/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ${PORT49_COMPOSE_LOCAL}/oidc/pki:/pki:ro
    networks:
      port49:
        aliases: [keycloak.port49.lab]
    ports:
      - "127.0.0.1:18443:18443"

  port49-broker:
    volumes:
      - ${PORT49_COMPOSE_LOCAL}/oidc/idp-ca.pem:/etc/port49-oidc/idp-ca.pem:ro
    # service_started is all this asks: Keycloak's image carries no HTTP client
    # for a healthcheck, and the broker must not wait on the provider anyway
    # (Ruling 4). Its first key-set fetches fail while Keycloak imports the
    # realm; the test's first mint retries on identity_provider_unavailable.
    depends_on:
      keycloak: {condition: service_started}
