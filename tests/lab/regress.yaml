  # TestL73 writes the L71 note of its platform: it appends an addendum to one that exists, so
  # a rerun grows L71-<platform>.md and notediff shows it. The help-only platforms (iolxe1718,
  # xrd261) ask L71's question alone; their entries exist for that note.
