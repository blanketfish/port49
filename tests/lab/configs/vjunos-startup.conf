system {
    host-name srx1;
    /* `password` is listed so that a local account can still log in while
       port49 is not answering, which is a convenience for whoever is debugging
       this lab by hand. Nothing in the harness depends on it: the readiness
       gate passes on either a breakglass login or the device running SSH
       authentication to a rejection. See waitDeviceReady in
       tests/lab/harness_test.go.

       This statement is also what register entry L4 is about, so TestL4FallThrough
       switches it at runtime and puts it back. Do not read a value here as the
       value a measurement was taken under; the results note names its own.

       L4 stays open. Do not write the design's reference AAA configuration as
       though Junos offers local fall-through generally — the measurements are
       per image and per condition, and they are in tests/lab/results/L4-*.md.

       The breakglass account below and the secret above are duplicated in
       tests/lab/harness_test.go as breakglassUser, breakglassPassword and
       labKeyDefault. Nothing checks that they agree; change both places
       together.

       On comment syntax, the hard way: a Junos comment is a slash-star pair or
       a # to end of line, and a // line is not a comment at all. Never write a
       closing slash-star pair inside comment prose either, not even as an
       example. This block used to, and it cost a lab run: the comment ended in
       the middle of its own sentence, the rest of the sentence became
       configuration tokens, and they swallowed the authentication-order
       statement below. Everything else in this file committed, so the device
       came up, answered a breakglass login, and looked healthy while having no
       reason to speak TACACS+ at all. */
    authentication-order [ tacplus password ];
    /* `routing-instance mgmt_junos` is not optional on these images. Both
       vrnetlab Junos images ship an /init.conf that sets `management-instance`
       and defines `routing-instances { mgmt_junos { ... } }`, which moves fxp0
       — the only interface with a path to port49d — out of the default
       instance. Without this statement Junos sources TACACS+ from the default
       instance, which has no route to 172.100.100.1, and the device sends
       nothing at all: SSH reaches the auth stage, then fails with "unable to
       authenticate" while the decision log stays empty and the capture holds
       zero device packets. That is exactly what the first run on this host did.

       Verify with `show configuration system tacplus-server` and
       `show route table mgmt_junos.inet.0` on the device. */
    tacplus-server {
        172.100.100.1 {
            secret "labsecret";
            routing-instance mgmt_junos;
        }
    }
    login {
        user remote {
            uid 2001;
            class p49-readonly;
        }
        user breakglass {
            uid 2002;
            class super-user;
            authentication {
                /* This is a SHA-512 crypt hash of breakglassPassword in
                   tests/lab/harness_test.go — that constant is the source of
                   truth for the plaintext, and this line is only its hash.
                   Regenerate with `openssl passwd -6 -salt p49labsalt` over
                   that same constant if it ever changes. Neither is a secret:
                   both are published lab constants in a public repository, and
                   the account exists only inside this containerlab topology.

                   It is a hash rather than plain-text-password-value because
                   that form does not produce a usable password on vSRX
                   21.4R3.15. Junos normally converts it to an
                   encrypted-password at commit; on that image it does not, and
                   the account ended up with a disabled password field in
                   /etc/master.passwd — cannot authenticate with one — so every
                   refused breakglass login there said nothing about
                   authentication-order, because there was nothing to fall
                   through TO. Measured 2026-09-20 off the console, in
                   tests/lab/results/juniper_vsrx-config-verified.md.

                   Verified after this change on BOTH images: breakglass logs
                   in over SSH with port49d not running. Do not go back to
                   plain-text-password-value. */
                encrypted-password "$6$p49labsalt$WNH1ZGGVOs3tX2.nQksG5/OdntpoPCM67dj7jtrxABEV2lS.OO/FgXI0e.mwkgoXPkto1koirKxfa5kM8zHgs1";
            }
        }
        class p49-readonly {
            permissions [ view view-configuration ];
        }
    }
    accounting {
        events [ login change-log interactive-commands ];
        destination {
            tacplus {
                server {
                    /* Same reason as tacplus-server above: the accounting
                       destination needs the management instance too, or the
                       records never leave the device. */
                    172.100.100.1 {
                        secret "labsecret";
                        routing-instance mgmt_junos;
                    }
                }
            }
        }
    }
}
