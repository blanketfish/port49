system {
    host-name srx1;
    /* `password` is listed so that a local account can still log in while
       port49 is not answering. That is a convenience for whoever is debugging
       this lab by hand; nothing in the harness depends on it any more, and it
       is measured NOT to work on one of the two images here.

       It used to be depended on. The readiness gate proved this file had been
       applied by logging in as breakglass before port49d starts, which works
       only if Junos falls through this order to the local password while the
       TACACS+ server is unreachable. vJunos-router 23.4R2-S2.1 does.
       vSRX 21.4R3.15 does NOT — with nothing listening on 172.100.100.1:49 it
       refused breakglass, admin and root over SSH, and only the serial console
       got in. Measured 2026-09-20; the configuration was read off the console
       while it was refusing those logins, in
       tests/lab/results/juniper_vsrx-config-verified.md. So on vSRX the gate
       could never pass: it spent the whole boot budget every run and stamped a
       caveat on every results note.

       The gate now passes on either a breakglass login OR the device running
       SSH authentication to a rejection, which proves sshd and the
       authentication subsystem are serving without assuming anything about
       fall-through. See waitDeviceReady in tests/lab/harness_test.go.

       Register entry L4 is the open question this measurement belongs to, and
       it stays open: one platform, one condition, and fall-through on a denial
       rather than on an unreachable server still unmeasured. Do not write the
       design's reference AAA configuration as though Junos offers local
       fall-through generally.

       The breakglass account below and the secret above are duplicated in
       tests/lab/harness_test.go as breakglassUser, breakglassPassword and
       labKeyDefault. Nothing checks that they agree; change both places
       together.

       On comment syntax, the hard way: a Junos comment is a slash-star pair or
       a # to end of line, and a // line is not a comment at all. Never write a
       closing slash-star pair inside comment prose either, not even as an
       example. This block used to, and it cost a lab run: the comment ended in
       the middle of its own sentence, the rest of the sentence became
       configuration tokens, and they swallowed the authentication-order
       statement below. Everything else in this file committed, so the device
       came up, answered a breakglass login, and looked healthy while having no
       reason to speak TACACS+ at all. */
    authentication-order [ tacplus password ];
    /* `routing-instance mgmt_junos` is not optional on these images. Both
       vrnetlab Junos images ship an /init.conf that sets `management-instance`
       and defines `routing-instances { mgmt_junos { ... } }`, which moves fxp0
       — the only interface with a path to port49d — out of the default
       instance. Without this statement Junos sources TACACS+ from the default
       instance, which has no route to 172.100.100.1, and the device sends
       nothing at all: SSH reaches the auth stage, then fails with "unable to
       authenticate" while the decision log stays empty and the capture holds
       zero device packets. That is exactly what the first run on this host did.

       Verify with `show configuration system tacplus-server` and
       `show route table mgmt_junos.inet.0` on the device. */
    tacplus-server {
        172.100.100.1 {
            secret "labsecret";
            routing-instance mgmt_junos;
        }
    }
    login {
        user remote {
            uid 2001;
            class p49-readonly;
        }
        user breakglass {
            uid 2002;
            class super-user;
            authentication {
                plain-text-password-value "breakglass-only";
            }
        }
        class p49-readonly {
            permissions [ view view-configuration ];
        }
    }
    accounting {
        events [ login change-log interactive-commands ];
        destination {
            tacplus {
                server {
                    /* Same reason as tacplus-server above: the accounting
                       destination needs the management instance too, or the
                       records never leave the device. */
                    172.100.100.1 {
                        secret "labsecret";
                        routing-instance mgmt_junos;
                    }
                }
            }
        }
    }
}
