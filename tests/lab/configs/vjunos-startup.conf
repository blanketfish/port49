system {
    host-name srx1;
    authentication-order tacplus;
    tacplus-server {
        172.100.100.1 secret "labsecret";
    }
    login {
        user remote {
            uid 2001;
            class p49-readonly;
        }
        user breakglass {
            uid 2002;
            class super-user;
            authentication {
                plain-text-password-value "breakglass-only";
            }
        }
        class p49-readonly {
            permissions [ view view-configuration ];
        }
    }
    accounting {
        events [ login change-log interactive-commands ];
        destination {
            tacplus {
                server {
                    172.100.100.1 secret "labsecret";
                }
            }
        }
    }
}
