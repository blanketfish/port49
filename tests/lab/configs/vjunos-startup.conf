system {
    host-name srx1;
    /* `password` is listed so that a local account still logs in while port49
       is not answering. The harness needs exactly that: it proves this file was
       applied by logging in as breakglass BEFORE it starts port49d, and a
       device that admitted nobody in that window would look identical to one
       that never finished booting.

       Junos is documented to fall back to the local password when no configured
       server responds, even without `password` in the order — but whether it
       does, and whether it also falls back on a denial, is open register entry
       L4. A readiness gate may not rest on an unmeasured claim, so the order
       lists it. This makes the lab configuration deliberately weaker than the
       reference AAA configuration the design recommends; L4 is what decides
       what that reference should say.

       Comments in a Junos configuration are /* */ or #. A // line is not a
       comment here, and one in this file fails the whole startup config. */
    authentication-order [ tacplus password ];
    tacplus-server {
        172.100.100.1 secret "labsecret";
    }
    login {
        user remote {
            uid 2001;
            class p49-readonly;
        }
        user breakglass {
            uid 2002;
            class super-user;
            authentication {
                plain-text-password-value "breakglass-only";
            }
        }
        class p49-readonly {
            permissions [ view view-configuration ];
        }
    }
    accounting {
        events [ login change-log interactive-commands ];
        destination {
            tacplus {
                server {
                    172.100.100.1 secret "labsecret";
                }
            }
        }
    }
}
