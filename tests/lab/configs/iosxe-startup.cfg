! Catalyst 8000V (IOS-XE 17.13.01a) startup configuration for the port49 lab.
!
! READ THIS FIRST: like tests/lab/configs/nxos-startup.cfg, and unlike
! configs/eos-startup.cfg, this file is NOT a complete running-config. The
! vrnetlab c8000v launcher builds its own bootstrap config (hostname, the
! `vrnetlab` privilege-15 account, `vrf definition clab-mgmt`,
! GigabitEthernet1's address inside that VRF, the default route, `line vty 0 4`
! with `login local`, `restconf`, `netconf-yang`, the SSH algorithm lines),
! appends this file to it, writes the whole thing onto a CD-ROM as
! `iosxe_config.txt` and lets CVAC apply it at boot -- see `gen_bootstrap_config`
! and `create_config_image` in vrnetlab/cisco/c8000v/docker/launch.py. So every
! line here must be a valid CONFIGURATION-mode command: no `configure terminal`,
! no `end`, no `write memory`.
!
! It must also be the AUTONOMOUS-mode build. The controller (SD-WAN) image uses
! VRF 513, omits `login local`, and expects vManage to provision its AAA; none of
! the lines below describe that device. topologies/iosxe.clab.yml says which tag.
!
! The values below are duplicated in tests/lab/harness_test.go, as the constants
! breakglassUser/breakglassPassword/enableSecret and labKeyDefault, and nothing
! checks that they agree. Rename the account or change the key here and the
! harness breaks with no build error: the readiness gate stops passing, or every
! device packet fails key trial. Change both places together.
!
! This file is ASCII only and checkStartupConfigASCII refuses to deploy it
! otherwise. Write `--` for an em dash; see tests/lab/README.md for the N9Kv
! deploy that measured nothing because of one em dash in a comment.
!
! ---------------------------------------------------------------------------
! AAA
! ---------------------------------------------------------------------------
!
! `aaa new-model` comes first and everything below depends on it: without it
! IOS-XE rejects every `aaa` line, and a rejected line in a CVAC config does not
! stop the lines after it. It also removes the bootstrap's `login local` from the
! vty lines, which is why those lines are restated at the bottom of this file.
aaa new-model
!
! The local account. `privilege 15` is not enough on its own and the reason is
! the same lesson EOS and NX-OS taught in tests/lab/results/L4-arista_eos.md:
! when TACACS+ is unreachable, `aaa authorization commands ... local` authorizes
! a command only if the user's privilege level is at or above the command's. An
! account that can log in during an outage and cannot configure anything is not
! a break-glass account.
!
! `secret 0 <clear>` rather than `password`: IOS-XE 17.x stores the former as a
! type-9 hash and warns about the latter. The value is a published lab constant
! in a public repository and the account exists only inside this containerlab
! topology.
username breakglass privilege 15 secret 0 breakglass-only
!
! The enable secret is what `aaa authentication enable default group port49
! enable` falls back to, so L3's enable exchange has somewhere to land when
! port49 refuses it and L4 has an enable-list cell to ask about later. It is the
! same published lab constant as the break-glass password on purpose: one value
! to keep in step with harness_test.go instead of two.
enable secret 0 breakglass-only
!
! `tacacs server <name>` is the IOS-XE 17.x form; the old global
! `tacacs-server host` line is deprecated and hides the key in a different place.
tacacs server port49-host
 address ipv4 172.100.100.1
 key 0 labsecret
 timeout 5
!
! `ip vrf forwarding` and `ip tacacs source-interface` are the IOS-XE equivalent
! of `use-vrf management` / `source-interface mgmt0` in configs/nxos-startup.cfg
! and of `routing-instance mgmt_junos` in configs/vjunos-startup.conf, and they
! fail the same way when they are missing. The launcher puts GigabitEthernet1 --
! the only interface with a path to port49d -- inside `vrf definition clab-mgmt`
! and installs the default route there. Without these two lines IOS-XE sources
! TACACS+ from the global table, which has no route to 172.100.100.1, and the
! device sends nothing at all: SSH reaches the authentication stage and fails
! while the decision log stays empty and the capture holds zero device packets.
!
! Verify on the device with `show tacacs`, `show aaa servers` and
! `show ip route vrf clab-mgmt 172.100.100.1`.
aaa group server tacacs+ port49
 server name port49-host
 ip vrf forwarding clab-mgmt
 ip tacacs source-interface GigabitEthernet1
!
! The method lists. `local` is listed on the login list so the break-glass
! account has a route in during an outage; whether IOS-XE actually takes it when
! port49 answers FAIL rather than going unreachable is register entry L4.
aaa authentication login default group port49 local
!
! The enable list is the one L3 exists for. `enable` at the end is the local
! `enable secret` above, so a refused enable falls back rather than locking the
! session at privilege 1 with no way up.
aaa authentication enable default group port49 enable
!
! Exec authorization is what applies port49's `priv-lvl` attribute to the
! session. Note what that means for L3: the lab authorizer answers `priv-lvl=15`
! (lab.session_attributes in tests/lab/port49d-lab.yaml), so a token operator
! lands in enable mode and `enable` there authenticates nothing. `disable` first
! is what makes the exchange real, exactly as on EOS -- see l3Observation in
! tests/lab/l3_test.go.
aaa authorization exec default group port49 local
!
! Both privilege levels, because IOS-XE authorizes a command against the list
! for the level the command sits at, and a lab that configured only 15 would see
! no authorization request for anything an unprivileged session types -- which
! is the half of L2 and L10 that matters after a `disable`.
aaa authorization commands 1 default group port49 local
aaa authorization commands 7 default group port49 local
aaa authorization commands 15 default group port49 local
!
! Level 7 is port49's `operator` on this platform (plan 5, decision 25), and
! it is level 1 until the device is told what it may run: this line is the
! operator rung measured in tests/lab/results/ceiling-cisco_iosxe.md --
! `clear counters` yes, `clear ip bgp *` and `configure terminal` no, with the
! commands 7 list above present. What the device does with a level-7 command
! when that list is absent is unmeasured, provisional on L22 (plan 5a, Task
! 17); the list stays either way.
privilege exec level 7 clear counters
!
! Without this, commands typed inside configuration mode are not authorized at
! all and L2's denial would never be reachable from `configure terminal`.
aaa authorization config-commands
!
aaa accounting exec default start-stop group port49
aaa accounting commands 1 default start-stop group port49
aaa accounting commands 7 default start-stop group port49
aaa accounting commands 15 default start-stop group port49
!
! ---------------------------------------------------------------------------
! Keeping the console usable, which is not optional on this platform
! ---------------------------------------------------------------------------
!
! NX-OS gets this for free: it keeps a separate `aaa authentication login
! console` list that defaults to `local`, so the console still takes the
! break-glass password while the `default` list points at a stopped port49. IOS-XE
! has no such default -- `line con 0` uses the `default` list like every vty --
! so a method list with no `local` method plus a stopped daemon locks out SSH
! and the console together, and the device cannot be put back without a redeploy.
!
! L4 sets exactly that method list, deliberately, as its second cell. A named
! list pinned to `local` on the console is what makes the restore afterwards
! possible. It does not weaken what L4 measures: L4 logs in over SSH, and the
! vty lines use the `default` list under test.
aaa authentication login CONSOLE local
!
line con 0
 login authentication CONSOLE
 exec-timeout 0 0
!
! `exec-timeout 0 0` because L5 holds an idle session open for two and a half
! minutes waiting to see whether a WATCHDOG ever arrives, and a vty that timed
! out underneath it would report "no WATCHDOG" for the wrong reason.
!
! vty 5 15 exist so concurrent tests -- L1 and L3 each open two sessions at
! once, on top of whatever the readiness gate is doing -- do not run out of
! lines and start measuring "connection refused".
line vty 0 4
 exec-timeout 0 0
 transport input ssh
line vty 5 15
 exec-timeout 0 0
 transport input ssh
!
! A mistyped command on IOS-XE is treated as a hostname to telnet to, and the
! session then blocks for 30 seconds trying to resolve it. Every `expect` in this
! harness has a deadline; this line keeps a typo from spending one.
no ip domain lookup
!
ip ssh version 2
