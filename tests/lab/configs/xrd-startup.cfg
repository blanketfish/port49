! L71 help cell only (selector xrd261). containerlab's cisco_xrd kind applies
! this file as the node's first-boot config; containerlab's docs say a user-
! defined config starts from its default template (nodes/xrd/xrd.cfg), which
! holds the SSH server lines, so this file does not get them unless it carries
! them. This adds the lab's break-glass account and the SSH lines the template
! has (the VRF and NETCONF ones are left out). Nothing here configures TACACS+.
! The account is breakglassUser/breakglassPassword in tests/lab/harness_test.go.
hostname xrd1
!
username breakglass
 group root-lr
 group cisco-support
 secret 0 breakglass-only
!
line default
 transport input ssh
!
ssh server v2
!
