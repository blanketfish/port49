! XRd 26.1.1 startup configuration for the port49 lab (selector xrd261, opt-in).
! containerlab's cisco_xrd kind applies this file as the node's first-boot
! config; containerlab's docs say a user-defined config starts from its default
! template (nodes/xrd/xrd.cfg), which holds the SSH server lines, so this file
! does not get them unless it carries them. This adds the lab's break-glass
! account, the SSH lines the template has (the VRF and NETCONF ones are left out)
! and the TACACS+ client the L73 and conformance runs start from: one plain
! server (port49d on the bridge) in the group port49, and the login, exec and
! command methods that try it first and fall back to the local account.
! The account is breakglassUser/breakglassPassword in tests/lab/harness_test.go;
! the key is labsecret (tests/lab/labcreds). The undo in
! tests/lab/l73_dialect.go (l73XRUndo) types the TACACS+ lines below back, and a
! unit test checks they are here. The domain name is the enrolment's.
hostname xrd1
!
! XR will not enroll a certificate without a domain name ("Failed to enroll:
! ... Domain name is not configured", the 2026-10-21 L73 run).
domain name lab.port49.test
!
username breakglass
 group root-lr
 group cisco-support
 secret 0 breakglass-only
!
line default
 transport input ssh
!
ssh server v2
!
tacacs-server host 172.100.100.1 key 0 labsecret
!
aaa group server tacacs+ port49
 server 172.100.100.1
!
aaa authentication login default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands default start-stop group port49
!
