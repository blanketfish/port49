hostname leaf1
!
! The two values below are duplicated in tests/lab/harness_test.go, as the
! constants breakglassUser/breakglassPassword and labKeyDefault, and nothing
! checks that they agree. Rename the account or change the key here and the
! harness breaks with no build error: the readiness gate stops passing, or
! every device packet fails key trial. Change both places together.
! `role network-admin` is not decoration, and it was added after a lab run
! failed on its absence. EOS command authorization under `... group port49
! local` falls back to the LOCAL role when port49 is unreachable, and an EOS
! role is not a privilege level: an account with `privilege 15` and no role
! gets the default role, which authorizes `show` and `enable` and then answers
! `% Authorization denied for command 'configure'`. A break-glass account that
! can log in during an outage and cannot configure anything is not a
! break-glass account. See tests/lab/results/L4-arista_eos.md.
username breakglass privilege 15 role network-admin secret 0 breakglass-only
!
tacacs-server host 172.100.100.1 key 0 labsecret
!
aaa group server tacacs+ port49
   server 172.100.100.1
!
aaa authentication login default group port49 local
aaa authentication enable default group port49 local
aaa authorization exec default group port49 local
aaa authorization commands all default group port49 local
aaa accounting exec default start-stop group port49
aaa accounting commands all default start-stop group port49
!
management api http-commands
   no shutdown
!
management ssh
   idle-timeout 60
