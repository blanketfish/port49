! N9Kv startup configuration for the port49 lab harness.
!
! READ THIS FIRST: unlike tests/lab/configs/eos-startup.cfg, this file is NOT a
! complete running-config. The vrnetlab n9kv launcher builds its own base config
! (hostname, the admin account, `vrf context management`, mgmt0's address and
! default route, `feature ssh`, `feature nxapi`, `feature netconf`,
! `feature grpc`), appends this file to it, and feeds the whole thing to the
! device line by line inside configuration mode — see `apply_config` in
! vrnetlab/cisco/n9kv/docker/launch.py. So every line here must be a valid
! CONFIGURATION-mode command. No `configure terminal`, no `end`, no `copy
! running-config startup-config`: the launcher does those itself.
!
! The values below are duplicated in tests/lab/harness_test.go, as the constants
! breakglassUser/breakglassPassword and labKeyDefault, and nothing checks that
! they agree. Rename the account or change the key here and the harness breaks
! with no build error: the readiness gate stops passing, or every device packet
! fails key trial. Change both places together.
!
! `no password strength-check` comes before the account and is not optional.
! NX-OS rejects a local password that fails its complexity rules, and
! `breakglass-only` fails them — no digit, no upper case, and it contains a
! dictionary word. Without this line the `username` below is refused, the device
! comes up with no local account, and the whole L4 fall-through matrix measures
! nothing on this platform. The password itself is a published lab constant in a
! public repository and the account exists only inside this containerlab
! topology.
!
! `role network-admin` is the same lesson EOS taught in
! tests/lab/results/L4-arista_eos.md: on NX-OS a role, not a privilege level, is
! what command authorization falls back to when TACACS+ is unreachable. An
! account that can log in during an outage and cannot configure anything is not
! a break-glass account.
no password strength-check
username breakglass password 0 breakglass-only role network-admin
!
! `feature tacacs+` must precede every `tacacs-server` and `aaa ... group` line:
! NX-OS rejects them outright while the feature is off, and a rejected line in
! the middle of a startup config does not stop the lines after it. The other two
! features are already enabled by the launcher's base config; they are repeated
! here because this file is what a reader consults to learn which transports the
! lab expects to be serving, and re-enabling an enabled feature is a no-op.
feature tacacs+
feature nxapi
feature netconf
!
tacacs-server host 172.100.100.1 key 0 labsecret
!
! `use-vrf management` and `source-interface mgmt0` are the NX-OS equivalent of
! the `routing-instance mgmt_junos` statement in configs/vjunos-startup.conf,
! and they fail the same way when they are missing. The vrnetlab launcher puts
! mgmt0 — the only interface with a path to port49d — inside `vrf context
! management` and installs the default route there. Without these two lines
! NX-OS sources TACACS+ from the default VRF, which has no route to
! 172.100.100.1, and the device sends nothing at all: SSH reaches the
! authentication stage and fails while the decision log stays empty and the
! capture holds zero device packets.
!
! Verify on the device with `show tacacs-server groups` and
! `show ip route 172.100.100.1 vrf management`.
aaa group server tacacs+ port49
  server 172.100.100.1
  use-vrf management
  source-interface mgmt0
!
! The method lists. `local` is listed on the login list so the break-glass
! account has a route in during an outage; whether NX-OS actually takes it when
! port49 answers FAIL rather than going unreachable is register entry L4, and it
! is unmeasured on this platform.
aaa authentication login default group port49 local
aaa authorization commands default group port49 local
aaa authorization config-commands default group port49 local
aaa accounting default group port49
!
! ASCII authentication is deliberately left at the NX-OS default, which is off,
! meaning this platform is expected to authenticate over TACACS+ with PAP rather
! than with the ASCII/CONTINUE exchange EOS and Junos use. That is a measurement
! this lab has never taken — register entry L8 lists PAP as unmeasured — so the
! default stays and the tests record what actually arrives in `auth.method`. Set
! `aaa authentication login ascii-authentication` here to measure the other
! shape; do not set it to make a test pass.
!
! NX-API listens on HTTPS 443. `nxapi use-vrf management` is what puts that
! listener in the VRF mgmt0 lives in; without it the host cannot reach the API
! at all and the L7 transport tests fail on a connection refused that looks like
! a device fault rather than a missing line.
nxapi use-vrf management
nxapi https port 443
