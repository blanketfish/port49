# L73 and the conformance run (selector xrd261, opt-in). The startup config
# carries the TACACS+ client; the inventory names the node xrd1.
name: port49-xrd261
topology:
  nodes:
    xrd1:
      kind: cisco_xrd
      image: port49lab/xrd-control-plane:26.1.1
      startup-config: ../configs/xrd-startup.cfg
      mgmt-ipv4: 172.100.100.61
mgmt:
  network: port49-lab
  ipv4-subnet: 172.100.100.0/24
