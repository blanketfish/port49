# L73 only (selector nxos106, opt-in). Node nx1 at 172.100.100.31 on purpose: the
# inventory, the seeds and the startup config are the older row's, and only
# one platform is up at a time.
name: port49-nxos106
topology:
  nodes:
    nx1:
      kind: cisco_n9kv
      image: vrnetlab/cisco_n9kv:9300v64-10.6.2.F
      startup-config: ../configs/nxos-startup.cfg
      mgmt-ipv4: 172.100.100.31
mgmt:
  network: port49-lab
  ipv4-subnet: 172.100.100.0/24
