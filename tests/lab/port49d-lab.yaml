    - {nas: vsrx1, username: alice, secret: p49_labtoken03, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken04, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken05, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken06, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken07, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken08, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken09, kind: login}
    - {nas: vsrx1, username: alice, secret: p49_labtoken10, kind: login}
