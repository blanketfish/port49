# port49d configuration for the containerlab harness (tests/lab/README.md).
#
# `listen` is the .1 gateway of the clab management bridge — the host namespace,
# where port49d runs — so the bridge must exist before the daemon starts. The
# harness deploys the topology first for that reason.
#
# Paths are relative to the repository root: the harness runs the daemon with
# its working directory set there.
listen: "172.100.100.1:49"
metrics_listen: "127.0.0.1:9049"
inventory_file: tests/lab/inventory-lab.yaml

keys:
  lab_key:
    current: {version: 1, secret_env: PORT49_LAB_KEY}

limits:
  # Longer than the product default (30s) on purpose: a device that holds one
  # TACACS connection open across an idle exec session should not have it closed
  # underneath it while L5 is waiting to see whether a WATCHDOG ever arrives.
  idle_timeout: 5m
  malformed_window: 10m

accounting:
  spool_path: /tmp/port49-lab-acct.jsonl

lab:
  session_attributes: ["priv-lvl=15"]
  # The long prefix is first: Lab.Command returns on the first prefix that
  # matches, and "show clock" would otherwise shadow it. L2 types this exact
  # line to see how long a server_msg the device will display.
  deny_prefixes:
    - "show clock | include AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    - "reload"
    - "request system reboot"
    - "show clock"
  # Redemption deletes the token, so every login in a run spends one. The pool
  # is larger than the run needs; lab.nextLogin() hands them out in order.
  #
  # Each login gets its OWN username, and that is a measurement, not a style
  # choice. EOS reports `port` as the constant string "ssh" (L1), so the receipt
  # key (nas, port, username) is identical for every SSH login by one user: a
  # second login inside receipt_ttl presents a different token against the first
  # login's receipt and is refused as credential_mismatch. Distinct usernames
  # give each login its own receipt key. See tests/lab/results/L1-arista_eos.md.
  seed_tokens:
    - {nas: leaf1, username: alice01, secret: p49_labtoken01, kind: login}
    - {nas: leaf1, username: alice02, secret: p49_labtoken02, kind: login}
    - {nas: leaf1, username: alice03, secret: p49_labtoken03, kind: login}
    - {nas: leaf1, username: alice04, secret: p49_labtoken04, kind: login}
    - {nas: leaf1, username: alice05, secret: p49_labtoken05, kind: login}
    - {nas: leaf1, username: alice06, secret: p49_labtoken06, kind: login}
    - {nas: leaf1, username: alice07, secret: p49_labtoken07, kind: login}
    - {nas: leaf1, username: alice08, secret: p49_labtoken08, kind: login}
    - {nas: leaf1, username: alice09, secret: p49_labtoken09, kind: login}
    - {nas: leaf1, username: alice10, secret: p49_labtoken10, kind: login}
    - {nas: leaf1, username: alice11, secret: p49_labtoken11, kind: login}
    - {nas: leaf1, username: alice12, secret: p49_labtoken12, kind: login}
    - {nas: leaf1, username: alice13, secret: p49_labtoken13, kind: login}
    - {nas: leaf1, username: alice14, secret: p49_labtoken14, kind: login}
    - {nas: leaf1, username: alice15, secret: p49_labtoken15, kind: login}
    - {nas: leaf1, username: alice16, secret: p49_labtoken16, kind: login}
    - {nas: srx1, username: alice01, secret: p49_labtoken01, kind: login}
    - {nas: srx1, username: alice02, secret: p49_labtoken02, kind: login}
    - {nas: srx1, username: alice03, secret: p49_labtoken03, kind: login}
    - {nas: srx1, username: alice04, secret: p49_labtoken04, kind: login}
    - {nas: srx1, username: alice05, secret: p49_labtoken05, kind: login}
    - {nas: srx1, username: alice06, secret: p49_labtoken06, kind: login}
    - {nas: srx1, username: alice07, secret: p49_labtoken07, kind: login}
    - {nas: srx1, username: alice08, secret: p49_labtoken08, kind: login}
    - {nas: srx1, username: alice09, secret: p49_labtoken09, kind: login}
    - {nas: srx1, username: alice10, secret: p49_labtoken10, kind: login}
    - {nas: srx1, username: alice11, secret: p49_labtoken11, kind: login}
    - {nas: srx1, username: alice12, secret: p49_labtoken12, kind: login}
    - {nas: srx1, username: alice13, secret: p49_labtoken13, kind: login}
    - {nas: srx1, username: alice14, secret: p49_labtoken14, kind: login}
    - {nas: srx1, username: alice15, secret: p49_labtoken15, kind: login}
    - {nas: srx1, username: alice16, secret: p49_labtoken16, kind: login}
    - {nas: vsrx1, username: alice01, secret: p49_labtoken01, kind: login}
    - {nas: vsrx1, username: alice02, secret: p49_labtoken02, kind: login}
    - {nas: vsrx1, username: alice03, secret: p49_labtoken03, kind: login}
    - {nas: vsrx1, username: alice04, secret: p49_labtoken04, kind: login}
    - {nas: vsrx1, username: alice05, secret: p49_labtoken05, kind: login}
    - {nas: vsrx1, username: alice06, secret: p49_labtoken06, kind: login}
    - {nas: vsrx1, username: alice07, secret: p49_labtoken07, kind: login}
    - {nas: vsrx1, username: alice08, secret: p49_labtoken08, kind: login}
    - {nas: vsrx1, username: alice09, secret: p49_labtoken09, kind: login}
    - {nas: vsrx1, username: alice10, secret: p49_labtoken10, kind: login}
    - {nas: vsrx1, username: alice11, secret: p49_labtoken11, kind: login}
    - {nas: vsrx1, username: alice12, secret: p49_labtoken12, kind: login}
    - {nas: vsrx1, username: alice13, secret: p49_labtoken13, kind: login}
    - {nas: vsrx1, username: alice14, secret: p49_labtoken14, kind: login}
    - {nas: vsrx1, username: alice15, secret: p49_labtoken15, kind: login}
    - {nas: vsrx1, username: alice16, secret: p49_labtoken16, kind: login}
    # L8: one token per password length under test, each under its own username,
    # so a device that truncates produces credential_mismatch against that user
    # rather than a silent pass against a shorter token.
    - {nas: leaf1, username: longpw30, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZ", kind: login}
    - {nas: srx1, username: longpw30, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZ", kind: login}
    - {nas: vsrx1, username: longpw30, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZ", kind: login}
    - {nas: leaf1, username: longpw64, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01234567", kind: login}
    - {nas: srx1, username: longpw64, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01234567", kind: login}
    - {nas: vsrx1, username: longpw64, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01234567", kind: login}
    - {nas: leaf1, username: longpw128, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", kind: login}
    - {nas: srx1, username: longpw128, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", kind: login}
    - {nas: vsrx1, username: longpw128, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", kind: login}
    - {nas: leaf1, username: longpw138, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ", kind: login}
    - {nas: srx1, username: longpw138, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ", kind: login}
    - {nas: vsrx1, username: longpw138, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ", kind: login}
    # NX-OS. Same pool shape as the platforms above: nextLogin hands out
    # alice01..alice16 per NAS, and L8 needs one token per password length.
    - {nas: nx1, username: alice01, secret: p49_labtoken01, kind: login}
    - {nas: nx1, username: alice02, secret: p49_labtoken02, kind: login}
    - {nas: nx1, username: alice03, secret: p49_labtoken03, kind: login}
    - {nas: nx1, username: alice04, secret: p49_labtoken04, kind: login}
    - {nas: nx1, username: alice05, secret: p49_labtoken05, kind: login}
    - {nas: nx1, username: alice06, secret: p49_labtoken06, kind: login}
    - {nas: nx1, username: alice07, secret: p49_labtoken07, kind: login}
    - {nas: nx1, username: alice08, secret: p49_labtoken08, kind: login}
    - {nas: nx1, username: alice09, secret: p49_labtoken09, kind: login}
    - {nas: nx1, username: alice10, secret: p49_labtoken10, kind: login}
    - {nas: nx1, username: alice11, secret: p49_labtoken11, kind: login}
    - {nas: nx1, username: alice12, secret: p49_labtoken12, kind: login}
    - {nas: nx1, username: alice13, secret: p49_labtoken13, kind: login}
    - {nas: nx1, username: alice14, secret: p49_labtoken14, kind: login}
    - {nas: nx1, username: alice15, secret: p49_labtoken15, kind: login}
    - {nas: nx1, username: alice16, secret: p49_labtoken16, kind: login}
    - {nas: nx1, username: longpw30, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZ", kind: login}
    - {nas: nx1, username: longpw64, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01234567", kind: login}
    - {nas: nx1, username: longpw128, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", kind: login}
    - {nas: nx1, username: longpw138, secret: "p49_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ", kind: login}
    # The API and NETCONF transports (tests/lab/transport_test.go, register
    # entry L7). These are a pool of their own rather than more alice names, and
    # the reason is the measurement itself: L7 asks how many authentication
    # exchanges one API request costs and whether a SECOND request with the SAME
    # token re-authenticates. A shared pool would make a test that spends three
    # tokens per request look like a test that ran out.
    #
    # Two users per transport. The `01` user is presented TWICE with the same
    # token — that repeat is the re-authentication measurement, and on a
    # single-use token the second attempt is expected to be refused. The `02`
    # user carries a FRESH token for the config-changing request, so a spent
    # `01` token cannot block the half of the test that asks whether the device
    # sends an authorization request for a configuration command at all.
    - {nas: leaf1, username: eapi01, secret: p49_labeapi01, kind: login}
    - {nas: leaf1, username: eapi02, secret: p49_labeapi02, kind: login}
    - {nas: leaf1, username: netconf01, secret: p49_labnetconf01, kind: login}
    - {nas: leaf1, username: netconf02, secret: p49_labnetconf02, kind: login}
    - {nas: nx1, username: nxapi01, secret: p49_labnxapi01, kind: login}
    - {nas: nx1, username: nxapi02, secret: p49_labnxapi02, kind: login}
    - {nas: nx1, username: netconf01, secret: p49_labnetconf01, kind: login}
    - {nas: nx1, username: netconf02, secret: p49_labnetconf02, kind: login}
    - {nas: srx1, username: netconf01, secret: p49_labnetconf01, kind: login}
    - {nas: srx1, username: netconf02, secret: p49_labnetconf02, kind: login}
    - {nas: vsrx1, username: netconf01, secret: p49_labnetconf01, kind: login}
    - {nas: vsrx1, username: netconf02, secret: p49_labnetconf02, kind: login}
