# port49d configuration for the containerlab harness (tests/lab/README.md).
#
# `listen` is the .1 gateway of the clab management bridge — the host namespace,
# where port49d runs — so the bridge must exist before the daemon starts. The
# harness deploys the topology first for that reason.
#
# Paths are relative to the repository root: the harness runs the daemon with
# its working directory set there.
listen: "172.100.100.1:49"
metrics_listen: "127.0.0.1:9049"
inventory_file: tests/lab/inventory-lab.yaml

keys:
  lab_key:
    current: {version: 1, secret_env: PORT49_LAB_KEY}

# Encryption at rest (design §8). The lab store is in memory and dies with the
# daemon, so this key protects nothing that outlives a run — but port49d refuses
# to start without one, deliberately, so the lab exercises the same path
# production does. The harness sets PORT49_LAB_ENC_KEY; see tests/lab/README.md.
encryption:
  current: {id: lab1, secret_env: PORT49_LAB_ENC_KEY}

limits:
  # Longer than the product default (30s) on purpose: a device that holds one
  # TACACS connection open across an idle exec session should not have it closed
  # underneath it while L5 is waiting to see whether a WATCHDOG ever arrives.
  idle_timeout: 5m
  malformed_window: 10m

session:
  # The lab's seeded contexts are judged by no broker, so nothing stamps
  # refreshed_at; the 4h default would deny a long run's seeds context_stale.
  staleness_ceiling: 0s

accounting:
  spool_path: /tmp/port49-lab-acct.jsonl

lab:
  # `shell:roles` is here because the N9Kv asks for it by name. Its session
  # authorization request is:
  #
  #   service=shell cmd= cisco-av-pair* shell:roles*
  #
  # where EOS asks `service=shell cmd*` and Junos asks for `service` alone. A
  # reply carrying only `priv-lvl=15` tells NX-OS nothing about what the session
  # may do: NX-OS assigns privileges by ROLE, not by privilege level, which is
  # the same lesson `role network-admin` taught in the two startup configs.
  #
  # It is sent as an OPTIONAL argument (`*`, not `=`). A mandatory argument a
  # device does not understand makes it fail the whole authorization, and EOS
  # and Junos do not understand this one. Optional, they ignore it (RFC 8907
  # §8.2) and NX-OS reads it.
  #
  # That is true of EOS, Junos and NX-OS and it is NOT true of IOS-XE, which is
  # a measurement rather than a caveat. On Catalyst 8000V 17.13.01a a session
  # authorization whose reply carries this attribute is refused by the device
  # -- `% Authorization failed.`, the SSH session closed -- even though port49
  # permitted it `context_matched`. An invented optional attribute fails the
  # same way, so it is not about `shell:roles` in particular: that image fails
  # an EXEC authorization carrying any attribute it does not recognise.
  # Measured 2026-09-20; see tests/lab/results/L10-cisco_iosxe.md.
  #
  # So this line is no longer one authorizer serving every platform. The
  # harness derives a copy of this file for `cisco_iosxe` with
  # `priv-lvl=15` alone -- see (*lab).configPath in tests/lab/harness_test.go.
  # Editing the line below changes four platforms; the fifth follows it only in
  # its first element.
  session_attributes: ["priv-lvl=15", "shell:roles*network-admin"]
  # Attributes on a PERMITTED per-command authorization reply. Empty is the
  # standing shape and means a bare permit, which is what every test but L18
  # measures against.
  #
  # Register entry L18 is why the key exists. That row asks what a device does
  # with a reply attribute it did not ask for, and three of the five platforms
  # here answer the SESSION form of that question by refusing the session
  # outright. Whether the same attribute on a per-command reply costs the
  # command, the session, or nothing is a separate question, and it was
  # unaskable while this list did not exist: the lab authorizer returned a bare
  # permit and there was no reply to put an attribute in. `(*lab).derivedConfigCmd`
  # substitutes this line per variant.
  command_attributes: []
  # The long prefix is first: Lab.Command returns on the first prefix that
  # matches, and "show clock" would otherwise shadow it. L2 types this exact
  # line to see how long a server_msg the device will display.
  deny_prefixes:
    - "show clock | include AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    - "reload"
    - "request system reboot"
    - "show clock"
  # Where port49d writes the pairs it mints for the seeds below: one JSON object
  # per line, mode 0600, truncated at every start. It is how the harness and the
  # redactor learn the credentials, because nothing else knows them — a seed
  # names who gets a token and the daemon chooses the secret.
  seed_token_file: /tmp/port49-lab-tokens.jsonl
  # Redemption deletes the token, so every login in a run spends one. The pool
  # is larger than the run needs; lab.nextLogin() hands them out in order.
  #
  # Each login gets its own username. That was once load-bearing for the receipt
  # key, which was (nas, port, username): EOS reports `port` as the constant
  # string "ssh" (L1), so every SSH login by one user shared a receipt and a
  # second login presenting a fresh token against the first one's receipt was
  # refused credential_mismatch. The receipt key now carries the credential hash
  # instead — (nas, username, credential_sha256), spec §13 decision 15 — so a
  # fresh token finds no receipt and redeems normally. What a username per login
  # still buys is a readable log: the username is on every record whether or not
  # a context lookup found anything. See tests/lab/results/L1-arista_eos.md.
  seed_tokens:
    - {nas: leaf1, username: alice01}
    - {nas: leaf1, username: alice02}
    - {nas: leaf1, username: alice03}
    - {nas: leaf1, username: alice04}
