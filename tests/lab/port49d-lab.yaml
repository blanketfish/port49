    # L8: one user per password length the first L8 method seeded. Nothing uses
    # them now: port49d mints every token at one length (30 characters, design
    # §8), and tests/lab/l8_test.go measures length without any seed, by typing
    # a probe under a username with no token and reading credential_sha256 off
