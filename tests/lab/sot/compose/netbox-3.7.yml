# NetBox 3.7 for L27 (plan 6a Task 2). Images pinned by digest, the tag in the comment.
# Follows netbox-docker 2.8.0 (image tag v3.7.8-2.8.0 is the same digest as v3.7.8).
# Superuser admin with a v1 API token (Token <40 hex>); every password, key and token
# comes from the recorder's environment and none is written here.
name: port49-l27-netbox37
x-netbox-env: &netbox-env
  DB_HOST: postgres
  DB_NAME: netbox
  DB_USER: netbox
  DB_PASSWORD: ${L27_DB_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_CACHE_HOST: redis
  SECRET_KEY: ${L27_SECRET_KEY:?}
services:
  netbox:
    image: docker.io/netboxcommunity/netbox:v3.7.8@sha256:9bf83b350a8956a83cccb11a6bf709fad0780f4e9ec4857adc747d547ade2134   # tag v3.7.8
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:18037:8080"]
    healthcheck: {test: "curl -f http://localhost:8080/api/ || exit 1", start_period: 300s, timeout: 3s, interval: 15s}
    environment:
      <<: *netbox-env
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: ${L27_ADMIN_PASSWORD:?}
      SUPERUSER_API_TOKEN: ${L27_TOKEN:?}
  netbox-worker:
    image: docker.io/netboxcommunity/netbox:v3.7.8@sha256:9bf83b350a8956a83cccb11a6bf709fad0780f4e9ec4857adc747d547ade2134   # tag v3.7.8
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    depends_on:
      netbox: {condition: service_healthy}
    environment: *netbox-env
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea   # tag 16-alpine
    healthcheck: {test: "pg_isready -q -d netbox -U netbox", interval: 5s, timeout: 5s, retries: 30}
    environment: {POSTGRES_DB: netbox, POSTGRES_USER: netbox, POSTGRES_PASSWORD: "${L27_DB_PASSWORD:?}"}
  redis:
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507   # tag 8-alpine
