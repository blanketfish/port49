# NetBox 4.x for L27 (plan 6a Task 2). Images pinned by digest, the tag in the comment.
# Follows netbox-docker 5.1.1 (image tag v4.7.1-5.1.1 is the same digest as v4.7.1).
# Superuser admin with a v2 API token (Bearer nbt_<key>.<token>); every password, key and
# token comes from the recorder's environment and none is written here.
name: port49-l27-netbox4
x-netbox-env: &netbox-env
  DB_HOST: postgres
  DB_NAME: netbox
  DB_USER: netbox
  DB_PASSWORD: ${L27_DB_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_CACHE_HOST: redis
  SECRET_KEY: ${L27_SECRET_KEY:?}
  API_TOKEN_PEPPER_1: ${L27_TOKEN_PEPPER:?}
services:
  netbox:
    image: docker.io/netboxcommunity/netbox:v4.7.1@sha256:59e3e5954d0243d8648f2fa7ba82cf7c7770aaeef392026cca8b21cd67411e74   # tag v4.7.1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:18080:8080"]
    healthcheck: {test: /opt/netbox/health.sh, start_period: 300s, timeout: 3s, interval: 15s}
    environment:
      <<: *netbox-env
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: ${L27_ADMIN_PASSWORD:?}
      SUPERUSER_API_KEY: ${L27_API_KEY:?}
      SUPERUSER_API_TOKEN: ${L27_API_TOKEN:?}
  netbox-worker:
    image: docker.io/netboxcommunity/netbox:v4.7.1@sha256:59e3e5954d0243d8648f2fa7ba82cf7c7770aaeef392026cca8b21cd67411e74   # tag v4.7.1
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    depends_on:
      netbox: {condition: service_healthy}
    environment: *netbox-env
    extra_hosts: ["port49-inventory.lab:host-gateway"]
    volumes: ["${L32_PKI:?}/ca.pem:/etc/port49-lab/ca.pem:ro"]
  proxy:
    profiles: ["l30"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L30_PROXY_PORT:?}:8080"]
    volumes: ["${L30_PROXY_CONF:?}:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [netbox]
  proxy_host:
    profiles: ["l32"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L32_HOST_PORT:?}:8443"]
    volumes: ["${L32_HOST_CONF:?}:/etc/nginx/conf.d/default.conf:ro", "${L32_PKI:?}:/etc/port49-lab:ro"]
    depends_on: [netbox]
  proxy_xfh:
    profiles: ["l32"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L32_XFH_PORT:?}:8443"]
    volumes: ["${L32_XFH_CONF:?}:/etc/nginx/conf.d/default.conf:ro", "${L32_PKI:?}:/etc/port49-lab:ro"]
    depends_on: [netbox]
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea   # tag 16-alpine
    healthcheck: {test: "pg_isready -q -d netbox -U netbox", interval: 5s, timeout: 5s, retries: 30}
    environment: {POSTGRES_DB: netbox, POSTGRES_USER: netbox, POSTGRES_PASSWORD: "${L27_DB_PASSWORD:?}"}
  redis:
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507   # tag 8-alpine
