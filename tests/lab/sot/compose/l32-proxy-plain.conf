# L32: a TLS-terminating reverse proxy with proxy_pass alone, as an operator
# writes one by default: nginx sends the upstream's name as Host, and no
# X-Forwarded-Host or X-Forwarded-Proto. A release then names its own host
# and scheme in next, which the connector must rebuild on url, saying so.
# run.sh substitutes nautobot:8080 for Nautobot.
server {
    listen 8443 ssl;
    ssl_certificate     /etc/port49-lab/proxy.pem;
    ssl_certificate_key /etc/port49-lab/proxy-key.pem;
    location / {
        proxy_pass http://netbox:8080;
    }
}
