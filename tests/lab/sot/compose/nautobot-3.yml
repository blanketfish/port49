# Nautobot 3.x for L30 (plan 6b Task 2), from nautobot-2.yml. Images pinned by digest, the tag in the comment.
# The image's entrypoint migrates and creates the superuser and its API token (Token <40 hex>);
# every password, key and token comes from the recorder's environment and none is written here.
# The web service runs the image's default command (nautobot-server start --ini uwsgi.ini);
# Celery delivers webhooks, so the worker runs `nautobot-server celery worker`, and skips the
# entrypoint's migration because the web service has already run it.
name: port49-l27-nautobot3
x-nautobot-env: &nautobot-env
  NAUTOBOT_ALLOWED_HOSTS: "*"
  NAUTOBOT_DB_HOST: postgres
  NAUTOBOT_DB_NAME: nautobot
  NAUTOBOT_DB_USER: nautobot
  NAUTOBOT_DB_PASSWORD: ${L27_DB_PASSWORD:?}
  NAUTOBOT_REDIS_HOST: redis
  NAUTOBOT_SECRET_KEY: ${L27_SECRET_KEY:?}
services:
  nautobot:
    image: docker.io/networktocode/nautobot:3.2.6@sha256:37c315740a8242de6c0afbbdbd6f4ffa4f421949a16542a2dae61405d2dbd535   # tag 3.2.6, the newest 3.* on 2026-09-30
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:18030:8080"]
    healthcheck: {test: "curl -f http://localhost:8080/health/ || exit 1", start_period: 600s, timeout: 10s, interval: 15s}
    environment:
      <<: *nautobot-env
      MAX_DB_WAIT_TIME: "600"
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: admin
      NAUTOBOT_SUPERUSER_EMAIL: admin@example.com
      NAUTOBOT_SUPERUSER_PASSWORD: ${L27_ADMIN_PASSWORD:?}
      NAUTOBOT_SUPERUSER_API_TOKEN: ${L27_TOKEN:?}
  nautobot-worker:
    image: docker.io/networktocode/nautobot:3.2.6@sha256:37c315740a8242de6c0afbbdbd6f4ffa4f421949a16542a2dae61405d2dbd535   # tag 3.2.6, the newest 3.* on 2026-09-30
    command: ["nautobot-server", "celery", "worker", "--loglevel", "INFO"]
    depends_on:
      nautobot: {condition: service_healthy}
    healthcheck: {disable: true}
    environment:
      <<: *nautobot-env
      NAUTOBOT_DOCKER_SKIP_INIT: "true"
    extra_hosts: ["port49-inventory.lab:host-gateway"]
    volumes: ["${L32_PKI:?}/ca.pem:/etc/port49-lab/ca.pem:ro"]
  proxy:
    profiles: ["l30"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L30_PROXY_PORT:?}:8080"]
    volumes: ["${L30_PROXY_CONF:?}:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [nautobot]
  proxy_host:
    profiles: ["l32"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L32_HOST_PORT:?}:8443"]
    volumes: ["${L32_HOST_CONF:?}:/etc/nginx/conf.d/default.conf:ro", "${L32_PKI:?}:/etc/port49-lab:ro"]
    depends_on: [nautobot]
  proxy_xfh:
    profiles: ["l32"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L32_XFH_PORT:?}:8443"]
    volumes: ["${L32_XFH_CONF:?}:/etc/nginx/conf.d/default.conf:ro", "${L32_PKI:?}:/etc/port49-lab:ro"]
    depends_on: [nautobot]
  proxy_plain:
    profiles: ["l32"]
    image: docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # tag 1.27-alpine
    ports: ["127.0.0.1:${L32_PLAIN_PORT:?}:8443"]
    volumes: ["${L32_PLAIN_CONF:?}:/etc/nginx/conf.d/default.conf:ro", "${L32_PKI:?}:/etc/port49-lab:ro"]
    depends_on: [nautobot]
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea   # tag 16-alpine
    healthcheck: {test: "pg_isready -q -d nautobot -U nautobot", interval: 5s, timeout: 5s, retries: 30}
    environment: {POSTGRES_DB: nautobot, POSTGRES_USER: nautobot, POSTGRES_PASSWORD: "${L27_DB_PASSWORD:?}"}
  redis:
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507   # tag 8-alpine
