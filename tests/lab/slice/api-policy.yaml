# TestAPIRevokeEndToEnd's lab policy (plan 7c): the slice's, with an on-call and a peer.
# The vertical slice's lab policy (plan 3). One subject: the client certificate
# `go run ./tests/lab/cmd/slice-pki` cuts. It may do everything on every device
# except one command, so the end-to-end run can show a permit and a denial that
# only the compiled blob could have made: `show hostname` (and `show users`, the
# IOS-XE stand-in, which has no `show hostname`) is in no deny list in
# port49d-lab.yaml, so a denial of it cannot have come from the lab authorizer.
#
# `slice01` is a username no seed uses, so nothing but a broker-minted token can
# log in under it.
#
# `all_devices` is declared: since plan 4 it is an ordinary scope (spec §5.5).
scopes:
  - {name: all_devices, match: {}}
roles:
  - {name: network_admin, privilege: admin, permit: ["**"]}
  - {name: slice_denies, deny: ["show hostname", "show users"]}
subjects:
  - {name: slice_operator, identity: ["user:alice@slice.port49.test"], username: slice01,
     enable: token, token_ttl: 60s}
  # The on-call: no grant on any device, and the rights to revoke others and to lift (spec §2).
  - {name: slice_oncall, identity: ["user:bob@slice.port49.test"], username: slice02, token_ttl: 60s,
     api: [revoke_others, lift_revocations]}
  # A peer: no grant and no right. What it asks of anyone else is refused.
  - {name: slice_peer, identity: ["user:carol@slice.port49.test"], username: slice03, token_ttl: 60s}
grants:
  - {subject: slice_operator, scope: all_devices, roles: [network_admin, slice_denies], max_privilege: admin}
# The device key sets live in the policy (decision 53 ruling 3); the lab
# harness sets the secret for port49d.
keys:
  lab_key:
    current: {version: 1, secret_ref: env:PORT49_KEY_LAB}
